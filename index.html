<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Crop — scan photo cropper</title>
<style>
:root {
  --bg: #f2f2f2;
  --panel: #ffffff;
  --panel-2: #fafafa;
  --text: #1f1f1f;
  --muted: #6b6b6b;
  --border: #d4d4d4;
  --accent: #1ca7e8;
  --sel: #1ca7e8;
  --other: #e03030;
  --shadow: rgba(0,0,0,0.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b1f;
    --panel: #232329;
    --panel-2: #2a2a31;
    --text: #e8e8ea;
    --muted: #9a9aa2;
    --border: #3a3a42;
    --accent: #4fb8ee;
    --sel: #4fb8ee;
    --other: #ff6b6b;
    --shadow: rgba(0,0,0,0.45);
  }
}
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
}
body { display: flex; flex-direction: column; overflow: hidden; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.toolbar button {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-2);
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
}
.toolbar button:hover { background: var(--border); }
.toolbar button:disabled { opacity: 0.45; cursor: default; }
.spacer { flex: 1; }
.zoom-lbl { color: var(--muted); font-variant-numeric: tabular-nums; }

.main {
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
}
.left {
  flex: 1 1 auto;
  min-width: 0;
  position: relative;
  background: #808080;
}
#view {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}
#drop-msg {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: #fff;
  font-size: 17px;
  text-align: center;
  pointer-events: none;
  padding: 24px;
  background: rgba(0,0,0,0.35);
}
#drop-msg .sub { font-size: 13px; opacity: 0.85; }

.right {
  flex: 0 0 360px;
  min-width: 0;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-left: 1px solid var(--border);
  min-height: 0;
}
.right .rhead {
  padding: 10px 12px 6px;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
#list {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}
.item {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-2);
  padding: 8px;
  cursor: pointer;
}
.item.sel { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
.item.excluded { opacity: 0.55; }
.item-top { display: flex; gap: 8px; }
.item canvas {
  width: 132px;
  height: 132px;
  flex: 0 0 132px;
  border-radius: 6px;
  background: #fff;
  border: 1px solid var(--border);
}
.item-info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.item-info input[type=text] {
  width: 100%;
  padding: 5px 7px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--panel);
  color: var(--text);
  font-size: 13px;
}
.rot-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
.rot-actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.rot-actions button {
  padding: 2px 6px;
  font-size: 11px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
}
.rot-actions button:hover { background: var(--border); }
.item-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.item-foot label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; cursor: pointer; }
.item-foot button {
  padding: 3px 9px;
  font-size: 12px;
  border: 1px solid #d64545;
  border-radius: 5px;
  background: transparent;
  color: #e05555;
  cursor: pointer;
}
.item-foot button:hover { background: #d64545; color: #fff; }
.empty-hint { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 10px; }

.settings {
  flex: 0 0 auto;
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.set-row { display: flex; align-items: center; gap: 8px; }
.set-row label { color: var(--muted); font-size: 12px; width: 90px; flex: 0 0 90px; }
.set-row select, .set-row input[type=range] { flex: 1 1 auto; }
.set-row select {
  padding: 5px 7px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--panel);
  color: var(--text);
}
.set-row .qval { width: 34px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.export-row { display: flex; justify-content: flex-end; }
#export {
  padding: 9px 22px;
  font-size: 14px;
  font-weight: 600;
  border: none;
  border-radius: 7px;
  background: var(--sel);
  color: #fff;
  cursor: pointer;
}
#export:hover { filter: brightness(1.1); }
#export:disabled { opacity: 0.5; cursor: default; filter: none; }

#status {
  flex: 0 0 auto;
  padding: 5px 12px;
  font-size: 12px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  background: var(--panel);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
<body>

<div class="toolbar">
  <button id="btn-open">Open image…</button>
  <button id="btn-openurl">Open URL…</button>
  <button id="btn-detect" disabled>Auto-detect</button>
  <button id="btn-clear" disabled>Clear boxes</button>
  <button id="btn-tiledbg">Tile debug: off</button>
  <input type="file" id="file" accept="image/png,image/jpeg,image/tiff,image/bmp,image/webp" hidden>
  <div class="spacer"></div>
  <span class="zoom-lbl" id="zoom-lbl">—</span>
</div>

<div class="main">
  <div class="left" id="left">
    <canvas id="view"></canvas>
    <div id="drop-msg">
      <div>Drop a scan here</div>
      <div class="sub">or use “Open image…” / “Open URL…” · wheel zooms · Ctrl+drag pans<br>drag empty canvas to draw a box</div>
    </div>
  </div>
  <div class="right">
    <div class="rhead">Crops</div>
    <div id="list"></div>
    <div class="settings">
      <div class="set-row">
        <label>Format</label>
        <select id="fmt">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
        </select>
        <span class="qval" id="qval">90</span>
      </div>
      <div class="set-row">
        <label>Quality</label>
        <input type="range" id="quality" min="1" max="100" value="90">
        <span></span>
      </div>
      <div class="export-row">
        <button id="export" disabled>Export</button>
      </div>
    </div>
  </div>
</div>

<div id="status">Drop a scan to begin.</div>

<script>
(() => {
"use strict";

const TILE = 256;
const HANDLE = 10;
const ROT_OFF = 34;
const MIN_SZ = 16;
const CACHE_MAX = 256;
const DETECT_MAX = 1600;
const THRESH = 235;
const MERGE_GAP_FRAC = 0.035;
const MIN_SIDE_FRAC = 0.02;
const MIN_AREA_FRAC = 0.0002;
const MARGIN_FRAC = 0.012;

const els = {
  view: document.getElementById("view"),
  left: document.getElementById("left"),
  drop: document.getElementById("drop-msg"),
  open: document.getElementById("btn-open"),
  openurl: document.getElementById("btn-openurl"),
  file: document.getElementById("file"),
  detect: document.getElementById("btn-detect"),
  clear: document.getElementById("btn-clear"),
  tiledbg: document.getElementById("btn-tiledbg"),
  list: document.getElementById("list"),
  zoom: document.getElementById("zoom-lbl"),
  fmt: document.getElementById("fmt"),
  quality: document.getElementById("quality"),
  qval: document.getElementById("qval"),
  export: document.getElementById("export"),
  status: document.getElementById("status"),
};

const cv = els.view;
const ctx = cv.getContext("2d");
let dpr = window.devicePixelRatio || 1;

const state = {
  img: null,
  iw: 0,
  ih: 0,
  blob: null,
  scale: 1,
  vx: 0,
  vy: 0,
  fitScale: 1,
  maxLevel: 0,
  boxes: [],
  sel: null,
  mode: null,
  drag: null,
  nameCounter: 1,
};
const cache = new Map();
let needRender = false;
let tileDebug = false;
let thumbDirty = new Set();
let items = [];

function status(msg) { els.status.textContent = msg; }
els.tiledbg.addEventListener("click", () => {
  tileDebug = !tileDebug;
  els.tiledbg.textContent = "Tile debug: " + (tileDebug ? "on" : "off");
  requestRender();
});
function requestRender() {
  if (needRender) return;
  needRender = true;
  requestAnimationFrame(render);
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rad(a) { return a * Math.PI / 180; }
function fmtDeg(v) {
  const r = Math.round(v * 100) / 100;
  return Number.isInteger(r) ? r.toFixed(0) : r.toFixed(2);
}

function setToolbar(hasImg) {
  els.detect.disabled = !hasImg;
  els.clear.disabled = !hasImg;
  els.export.disabled = !hasImg;
}

// --------------------------------------------------------------- files
els.open.addEventListener("click", () => els.file.click());
els.openurl.addEventListener("click", () => {
  const url = (prompt("Paste an image URL:") || "").trim();
  if (url) loadFromURL(url);
});
els.file.addEventListener("change", () => {
  if (els.file.files[0]) loadFile(els.file.files[0]);
  els.file.value = "";
});
["dragover", "drop"].forEach((t) => {
  window.addEventListener(t, (e) => { e.preventDefault(); });
});
window.addEventListener("drop", (e) => {
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
window.addEventListener("paste", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const text = (e.clipboardData || window.clipboardData || {}).getData ? (e.clipboardData || window.clipboardData).getData("text").trim() : "";
  if (/^https?:\/\//i.test(text)) {
    e.preventDefault();
    loadFromURL(text);
  }
});

async function loadFile(file) {
  status("Decoding…");
  els.drop.style.display = "none";
  const bitmap = await createImageBitmap(file);
  if (state.img) state.img.close();
  state.img = bitmap;
  state.blob = file;
  state.iw = bitmap.width;
  state.ih = bitmap.height;
  state.boxes = [];
  state.sel = null;
  state.nameCounter = 1;
  state.maxLevel = Math.max(0, Math.ceil(Math.log2(Math.max(state.iw, state.ih) / TILE)));
  for (const v of cache.values()) { if (v.img && v.img.close) v.img.close(); }
  cache.clear();
  inflight.clear();
  queued.length = 0;
  activeLevels.clear();
  targetLevel = -1;
  await workerSetSource(file);
  fitView();
  queueInitialBase();
  setToolbar(true);
  refreshList();
  requestRender();
  status(`Loaded ${file.name}  (${state.iw}×${state.ih}) — draw boxes or auto-detect`);
}

async function loadFromURL(url) {
  status("Downloading…");
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    if (!res.body) {
      const blob = await res.blob();
      const name = decodeURIComponent(url.split(/[?#]/)[0].split("/").pop()) || "image";
      loadFile(new File([blob], name));
      return;
    }
    const total = parseInt(res.headers.get("content-length") || "0", 10);
    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      status(total
        ? `Downloading… ${Math.min(100, Math.round(received / total * 100))}%`
        : `Downloading… ${(received / 1048576).toFixed(1)} MB`);
    }
    const name = decodeURIComponent(url.split(/[?#]/)[0].split("/").pop()) || "image";
    loadFile(new File([new Blob(chunks)], name));
  } catch (e) {
    status(`Could not open URL: ${e.message}`);
  }
}

const openParam = new URLSearchParams(location.search).get("file");
if (openParam) loadFromURL(openParam);

function fitView() {
  const vpw = cv.clientWidth || els.left.clientWidth;
  const vph = cv.clientHeight || els.left.clientHeight;
  state.fitScale = Math.min(vpw / state.iw, vph / state.ih) * 0.98;
  state.scale = state.fitScale;
  state.vx = (vpw - state.iw * state.scale) / 2;
  state.vy = (vph - state.ih * state.scale) / 2;
}

function resizeCanvas() {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
}
new ResizeObserver(() => {
  if (!state.img) return;
  resizeCanvas();
  fitView();
  requestRender();
}).observe(els.left);
resizeCanvas();

// ---------------------------------------------------------------- tiles
function levelForScale() {
  return clamp(Math.round(-Math.log2(state.scale)), 0, state.maxLevel);
}
function tileKey(L, tx, ty) { return L + ":" + tx + ":" + ty; }

// Levels currently drawn/kept as underlays during a transition (protected from
// eviction until the finer level covers them). The coarsest levels are always
// pinned as the ultimate fallback base.
const activeLevels = new Set();
let tileClock = 0;
let targetLevel = -1;

function isPinnedLevel(L) {
  return L >= Math.max(0, state.maxLevel - 1);
}
function isProtectedLevel(L) {
  return isPinnedLevel(L) || activeLevels.has(L);
}
function cacheGet(k) {
  const v = cache.get(k);
  if (!v) return null;
  v.lastUsed = ++tileClock;   // timestamp LRU: no Map re-insertion churn
  return v;
}
function cacheSet(k, img, L, quality) {
  const prev = cache.get(k);
  if (prev && prev.img && prev.img.close && prev.img !== img) prev.img.close();
  cache.set(k, { img, L, quality, lastUsed: ++tileClock });
  while (cache.size > CACHE_MAX) {
    // evict the least-recently-used unprotected entry
    let victimKey = null, victimTime = Infinity;
    for (const [key, val] of cache.entries()) {
      if (isProtectedLevel(val.L)) continue;
      if (val.lastUsed < victimTime) { victimTime = val.lastUsed; victimKey = key; }
    }
    if (victimKey === null) break; // everything left is protected
    const ev = cache.get(victimKey);
    if (ev && ev.img && ev.img.close) ev.img.close();
    cache.delete(victimKey);
  }
}

// ------------------------------------------------------- tile worker
const workerSupported = typeof Worker !== "undefined" &&
  typeof OffscreenCanvas !== "undefined" &&
  typeof createImageBitmap !== "undefined";

const WORKER_SRC = `
let img = null, iw = 0, ih = 0, TILE = 256;

// High-quality downscale via progressive halving: never reduce by more than
// 2x per step so every source pixel contributes (avoids aliasing/moire that a
// single large-ratio drawImage can produce).
function downscaleHQ(src, sx, sy, sw, sh, dw, dh) {
  let cur = new OffscreenCanvas(Math.max(1, Math.round(sw)), Math.max(1, Math.round(sh)));
  let cg = cur.getContext("2d");
  cg.imageSmoothingEnabled = true;
  cg.imageSmoothingQuality = "high";
  cg.drawImage(src, sx, sy, sw, sh, 0, 0, cur.width, cur.height);
  let cw = cur.width, ch = cur.height;
  while (cw > dw * 2 || ch > dh * 2) {
    const nw = Math.max(dw, Math.floor(cw / 2));
    const nh = Math.max(dh, Math.floor(ch / 2));
    const next = new OffscreenCanvas(nw, nh);
    const ng = next.getContext("2d");
    ng.imageSmoothingEnabled = true;
    ng.imageSmoothingQuality = "high";
    ng.drawImage(cur, 0, 0, cw, ch, 0, 0, nw, nh);
    cur = next; cg = ng; cw = nw; ch = nh;
  }
  const out = new OffscreenCanvas(dw, dh);
  const og = out.getContext("2d");
  og.imageSmoothingEnabled = true;
  og.imageSmoothingQuality = "high";
  og.drawImage(cur, 0, 0, cw, ch, 0, 0, dw, dh);
  return out;
}

self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === "init") {
    if (img && img.close) img.close();
    img = m.bitmap; iw = m.iw; ih = m.ih; TILE = m.TILE;
    self.postMessage({ type: "ready" });
    return;
  }
  if (m.type === "gen") {
    if (!img) return;
    const { L, tx, ty, quality } = m;
    const p = Math.pow(2, L);
    const sx = tx * TILE * p, sy = ty * TILE * p;
    const sw = Math.min(TILE * p, iw - sx);
    const sh = Math.min(TILE * p, ih - sy);
    if (sw <= 0 || sh <= 0) return;
    const dw = Math.max(1, Math.round(sw / p));
    const dh = Math.max(1, Math.round(sh / p));
    // always emit a TILE x TILE tile; partial (edge) tiles fill the top-left
    // dw x dh region, matching how render maps tiles onto the grid
    const c = new OffscreenCanvas(TILE, TILE);
    const g = c.getContext("2d");
    if (quality === "low") {
      // fast, blocky nearest-neighbour preview
      g.imageSmoothingEnabled = false;
      g.drawImage(img, sx, sy, sw, sh, 0, 0, dw, dh);
    } else {
      // high quality: progressive halving so no source pixel is skipped
      const out = downscaleHQ(img, sx, sy, sw, sh, dw, dh);
      g.imageSmoothingEnabled = true;
      g.imageSmoothingQuality = "high";
      g.drawImage(out, 0, 0, dw, dh, 0, 0, dw, dh);
    }
    const bmp = c.transferToImageBitmap();
    self.postMessage({ type: "tile", L, tx, ty, quality, bitmap: bmp }, [bmp]);
  }
};
`;

let tileWorker = null;
let workerReady = false;
const inflight = new Set(); // keys "L:tx:ty:quality" currently requested
const queued = [];          // pending gen requests {L,tx,ty,quality,key}

function initWorker() {
  if (!workerSupported) return;
  if (tileWorker) { tileWorker.terminate(); tileWorker = null; }
  workerReady = false;
  inflight.clear();
  queued.length = 0;
  const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
  tileWorker = new Worker(url);
  URL.revokeObjectURL(url);
  tileWorker.onmessage = (e) => {
    const m = e.data;
    if (m.type === "ready") {
      workerReady = true;
      pumpQueue();
      return;
    }
    if (m.type === "tile") {
      const rk = m.L + ":" + m.tx + ":" + m.ty + ":" + m.quality;
      inflight.delete(rk);
      const k = tileKey(m.L, m.tx, m.ty);
      const existing = cache.get(k);
      // never downgrade an existing high-quality tile
      if (!(existing && existing.quality === "high" && m.quality !== "high")) {
        cacheSet(k, m.bitmap, m.L, m.quality);
      } else if (m.bitmap.close) {
        m.bitmap.close();
      }
      pumpQueue();
      requestRender();
    }
  };
}

async function workerSetSource(file) {
  if (!workerSupported) return;
  initWorker();
  const bmp = await createImageBitmap(file);
  tileWorker.postMessage(
    { type: "init", bitmap: bmp, iw: state.iw, ih: state.ih, TILE },
    [bmp]
  );
}

const MAX_INFLIGHT = 6;
function genTileMainThread(L, tx, ty, quality) {
  const p = Math.pow(2, L);
  const sx = tx * TILE * p, sy = ty * TILE * p;
  const sw = Math.min(TILE * p, state.iw - sx);
  const sh = Math.min(TILE * p, state.ih - sy);
  if (sw <= 0 || sh <= 0) return;
  const c = new OffscreenCanvas(TILE, TILE);
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = quality !== "low";
  g.imageSmoothingQuality = quality;
  g.drawImage(state.img, sx, sy, sw, sh, 0, 0, sw / p, sh / p);
  const k = tileKey(L, tx, ty);
  const existing = cache.get(k);
  if (!(existing && existing.quality === "high" && quality !== "high")) {
    cacheSet(k, c, L, quality);
  }
}
// Drain the queue in its existing (enqueue-time) order. Order is decided when
// tiles are enqueued (nearest-first at a level switch) and never re-sorted here.
function pumpQueue() {
  if (!workerSupported) {
    if (!queued.length || !state.img) return;
    const req = queued.shift();
    genTileMainThread(req.L, req.tx, req.ty, "high");
    requestRender();
    if (queued.length) setTimeout(pumpQueue, 0);
    return;
  }
  if (!workerReady) return;
  while (inflight.size < MAX_INFLIGHT && queued.length) {
    const req = queued.shift();
    if (inflight.has(req.rk)) continue;
    inflight.add(req.rk);
    tileWorker.postMessage({ type: "gen", L: req.L, tx: req.tx, ty: req.ty, quality: req.quality });
  }
}

function requestTile(L, tx, ty, quality) {
  // low quality only used for the one-time initial coarse base
  if (!workerSupported && quality === "low") return;
  const rk = L + ":" + tx + ":" + ty + ":" + quality;
  if (inflight.has(rk)) return;
  if (queued.some((q) => q.rk === rk)) return;
  queued.push({ L, tx, ty, quality, rk });
}

// Prune not-yet-sent requests for levels we no longer care about. In-flight
// worker jobs are left to finish (their tiles may still be useful).
function abandonNonTargetLevels(keep) {
  for (let i = queued.length - 1; i >= 0; i--) {
    if (!keep.has(queued[i].L)) queued.splice(i, 1);
  }
}

// Enqueue every visible tile at the target level, ordered nearest-first from
// the viewport centre. Order is snapshotted here and not changed afterwards.
function enqueueLevelNearestFirst(L, quality) {
  const vpw = cv.clientWidth, vph = cv.clientHeight;
  const sc = state.scale;
  const tileW = TILE * Math.pow(2, L);
  const x0 = (0 - state.vx) / sc, y0 = (0 - state.vy) / sc;
  const x1 = (vpw - state.vx) / sc, y1 = (vph - state.vy) / sc;
  const tx0 = Math.max(0, Math.floor(x0 / tileW));
  const ty0 = Math.max(0, Math.floor(y0 / tileW));
  const tx1 = Math.min(Math.ceil(state.iw / tileW) - 1, Math.floor(x1 / tileW));
  const ty1 = Math.min(Math.ceil(state.ih / tileW) - 1, Math.floor(y1 / tileW));
  const ccx = vpw / 2, ccy = vph / 2;
  const list = [];
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (cacheHasHigh(tileKey(L, tx, ty))) continue; // already done
      const cx = state.vx + (tx + 0.5) * tileW * sc;
      const cy = state.vy + (ty + 0.5) * tileW * sc;
      const d2 = (cx - ccx) * (cx - ccx) + (cy - ccy) * (cy - ccy);
      list.push({ tx, ty, d2 });
    }
  }
  list.sort((a, b) => a.d2 - b.d2);
  for (const t of list) requestTile(L, t.tx, t.ty, quality);
}

function cacheHasHigh(k) {
  const v = cache.get(k);
  return !!(v && v.quality === "high");
}

// Called when the target detail level changes: abandon stale levels and queue
// the new level's tiles nearest-first. Keeps active underlays + pinned base.
function switchTargetLevel(L) {
  targetLevel = L;
  const keep = new Set([L]);
  for (const al of activeLevels) keep.add(al);
  keep.add(state.maxLevel);
  if (state.maxLevel - 1 >= 0) keep.add(state.maxLevel - 1);
  abandonNonTargetLevels(keep);
  // For coarse base levels the low-quality first paint is queued separately by
  // queueInitialBase(); render() promotes them to high once the low exists.
  // For other levels, enqueue high-quality tiles nearest-first now.
  if (!isPinnedLevel(L)) enqueueLevelNearestFirst(L, "high");
  pumpQueue();
}

function queueInitialBase() {
  if (!state.img) return;
  const minL = Math.max(0, state.maxLevel - 1);
  // Fast low-quality base first for an instant first paint. High-quality
  // upgrades are requested from render() only after each low tile exists, so
  // the user always sees the blurry base before crisp tiles replace it.
  for (let L = state.maxLevel; L >= minL; L--) enqueueLevelNearestFirst(L, "low");
  pumpQueue();
}

// -------------------------------------------------------------- render
function render() {
  needRender = false;
  const vpw = cv.clientWidth, vph = cv.clientHeight;
  if (!vpw || !vph) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#808080";
  ctx.fillRect(0, 0, vpw, vph);
  if (!state.img) return;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  const L = levelForScale();
  const sc = state.scale;
  const vpw2 = vpw, vph2 = vph;

  // helper: visible tile range at a given level
  function rangeAt(lv) {
    const tw = TILE * Math.pow(2, lv);
    const rx0 = (0 - state.vx) / sc, ry0 = (0 - state.vy) / sc;
    const rx1 = (vpw2 - state.vx) / sc, ry1 = (vph2 - state.vy) / sc;
    return {
      tw,
      tx0: Math.max(0, Math.floor(rx0 / tw)),
      ty0: Math.max(0, Math.floor(ry0 / tw)),
      tx1: Math.min(Math.ceil(state.iw / tw) - 1, Math.floor(rx1 / tw)),
      ty1: Math.min(Math.ceil(state.ih / tw) - 1, Math.floor(ry1 / tw)),
    };
  }

  // On a target-level change: abandon stale levels and enqueue the new level's
  // tiles nearest-first (order fixed here, not re-sorted per frame).
  if (L !== targetLevel) {
    activeLevels.add(L);
    switchTargetLevel(L);
  }

  // Coverage: is every visible tile at the target level present (high quality)?
  const r = rangeAt(L);
  let covered = true;
  for (let ty = r.ty0; ty <= r.ty1 && covered; ty++) {
    for (let tx = r.tx0; tx <= r.tx1; tx++) {
      if (!cacheHasHigh(tileKey(L, tx, ty))) { covered = false; break; }
    }
  }

  // Build the set of levels to composite: the target level plus any coarser
  // cached levels kept as underlay until the target covers the view.
  activeLevels.add(L);
  // Drop finer stale levels: a finer level drawn on top of a coarser target
  // (zoom-out) would show outdated detail. Only keep target + coarser underlays.
  for (const lv of [...activeLevels]) {
    if (lv < L && !isPinnedLevel(lv)) activeLevels.delete(lv);
  }
  if (covered) {
    // target fully covers the viewport -> unload coarser underlays (keep base)
    for (const lv of [...activeLevels]) {
      if (lv !== L && !isPinnedLevel(lv)) activeLevels.delete(lv);
    }
  }

  // Draw coarse -> fine so finer tiles land on top of coarser ones.
  const drawLevels = [...activeLevels].sort((a, b) => b - a);
  for (const lv of drawLevels) {
    const rr = rangeAt(lv);
    const twsc = rr.tw * sc;
    for (let ty = rr.ty0; ty <= rr.ty1; ty++) {
      for (let tx = rr.tx0; tx <= rr.tx1; tx++) {
        const entry = cacheGet(tileKey(lv, tx, ty));
        if (!entry) continue;
        ctx.drawImage(entry.img,
          state.vx + tx * twsc, state.vy + ty * twsc, twsc, twsc);
      }
    }
  }

  // Request high-quality tiles for the target level. For the coarse base
  // levels (which get an instant low-quality first paint), only request "high"
  // once the low tile exists, so the blurry base always paints before crisp
  // tiles replace it. For all other levels, request "high" directly (the
  // coarser active level is the visible preview meanwhile).
  const baseLevel = isPinnedLevel(L);
  for (let ty = r.ty0; ty <= r.ty1; ty++) {
    for (let tx = r.tx0; tx <= r.tx1; tx++) {
      const e = cache.get(tileKey(L, tx, ty));
      if (e && e.quality === "high") continue;
      if (baseLevel && !e) continue; // wait for the low base tile first
      requestTile(L, tx, ty, "high");
    }
  }

  if (tileDebug) {
    const rr = rangeAt(L);
    const twsc = rr.tw * sc;
    ctx.save();
    ctx.lineWidth = 1;
    ctx.font = "600 11px system-ui, sans-serif";
    ctx.textBaseline = "top";
    for (let ty = rr.ty0; ty <= rr.ty1; ty++) {
      for (let tx = rr.tx0; tx <= rr.tx1; tx++) {
        const e = cache.get(tileKey(L, tx, ty));
        // green = HQ present, yellow = low-quality base, red = uncovered gap
        const col = e ? (e.quality === "high" ? "#00e000" : "#e0c000") : "#ff2020";
        const dx = state.vx + tx * twsc, dy = state.vy + ty * twsc;
        ctx.strokeStyle = col;
        ctx.strokeRect(dx + 0.5, dy + 0.5, twsc - 1, twsc - 1);
        ctx.fillStyle = col;
        ctx.fillText(`L${L} ${tx},${ty}`, dx + 3, dy + 3);
      }
    }
    ctx.restore();
  }
  pumpQueue();
  drawBoxes();
  els.zoom.textContent = (state.scale * 100).toFixed(0) + "%";
  if (state.sel !== null && state.boxes[state.sel]) {
    const b = state.boxes[state.sel];
    status(`Selected ${state.sel + 1}/${state.boxes.length}  ${Math.round(b.w)}×${Math.round(b.h)}px  rot ${fmtDeg(b.rot)}°`);
  }
}

function devToWorld(mx, my) {
  return [(mx - state.vx) / state.scale, (my - state.vy) / state.scale];
}
function worldToDev(wx, wy) {
  return [state.vx + wx * state.scale, state.vy + wy * state.scale];
}

function boxLocalToWorld(b, lx, ly) {
  const a = rad(b.rot);
  return [b.cx + lx * Math.cos(a) - ly * Math.sin(a), b.cy + lx * Math.sin(a) + ly * Math.cos(a)];
}
function boxWorldToLocal(b, wx, wy) {
  const a = rad(b.rot);
  const rx = wx - b.cx, ry = wy - b.cy;
  return [rx * Math.cos(a) + ry * Math.sin(a), -rx * Math.sin(a) + ry * Math.cos(a)];
}
function boxClampCenter(b) {
  const a = rad(b.rot);
  const hw = b.w / 2, hh = b.h / 2;
  const cos = Math.cos(a), sin = Math.sin(a);
  let minOx = 1e9, maxOx = -1e9, minOy = 1e9, maxOy = -1e9;
  for (const [lx, ly] of [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]]) {
    const ox = lx * cos - ly * sin;
    const oy = lx * sin + ly * cos;
    minOx = Math.min(minOx, ox); maxOx = Math.max(maxOx, ox);
    minOy = Math.min(minOy, oy); maxOy = Math.max(maxOy, oy);
  }
  b.cx = clamp(b.cx, -minOx, state.iw - maxOx);
  b.cy = clamp(b.cy, -minOy, state.ih - maxOy);
}

function drawBoxes() {
  for (let i = 0; i < state.boxes.length; i++) {
    const b = state.boxes[i];
    const sel = i === state.sel;
    const [dx, dy] = worldToDev(b.cx, b.cy);
    const w = b.w * state.scale, h = b.h * state.scale;
    const a = rad(b.rot);
    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(a);
    ctx.strokeStyle = sel ? getComputedStyle(document.documentElement).getPropertyValue("--sel").trim() : "#e03030";
    ctx.lineWidth = sel ? 2.5 : 1.5;
    ctx.fillStyle = sel ? "rgba(28,167,232,0.10)" : "rgba(224,48,48,0.05)";
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.restore();
    const [lwx, lwy] = boxLocalToWorld(b, 0, -b.h / 2);
    const [ldx, ldy] = worldToDev(lwx, lwy);
    const name = (b.name && b.name.trim()) || ("photo-" + (i + 1));
    ctx.font = "600 12px system-ui, sans-serif";
    ctx.fillStyle = sel ? "#1ca7e8" : "#e03030";
    ctx.textBaseline = "bottom";
    ctx.fillText(`${i + 1}: ${name}`, ldx + 4, ldy - 3);
    if (sel) {
      const len = h / 2 + ROT_OFF;
      const hx = dx + len * Math.sin(a);
      const hy = dy - len * Math.cos(a);
      const tx = dx + (h / 2) * Math.sin(a);
      const ty = dy - (h / 2) * Math.cos(a);
      ctx.strokeStyle = "#1ca7e8";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(hx, hy);
      ctx.stroke();
      drawHandle(hx, hy, "#1ca7e8");
      boxSpotsDev().forEach((p) => drawHandle(p[0], p[1], "#1ca7e8"));
    }
  }
}
function drawHandle(x, y, col) {
  ctx.fillStyle = "#ffffff";
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.rect(x - HANDLE / 2, y - HANDLE / 2, HANDLE, HANDLE);
  ctx.fill();
  ctx.stroke();
}
function boxSpotsDev() {
  const b = state.boxes[state.sel];
  const [dx, dy] = worldToDev(b.cx, b.cy);
  const w = b.w * state.scale, h = b.h * state.scale;
  const a = rad(b.rot);
  const cos = Math.cos(a), sin = Math.sin(a);
  return [
    [-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2],
    [0, -h / 2], [0, h / 2], [-w / 2, 0], [w / 2, 0],
  ].map((p) => [dx + p[0] * cos - p[1] * sin, dy + p[0] * sin + p[1] * cos]);
}

// ---------------------------------------------------------- interaction
function handleSpots() {
  const spots = boxSpotsDev();
  const b = state.boxes[state.sel];
  const [dx, dy] = worldToDev(b.cx, b.cy);
  const h = b.h * state.scale;
  const a = rad(b.rot);
  spots.push([dx + (h / 2 + ROT_OFF) * Math.sin(a), dy - (h / 2 + ROT_OFF) * Math.cos(a)]);
  return spots;
}
function hitTest(mx, my) {
  if (state.sel !== null && state.boxes[state.sel]) {
    const spots = handleSpots();
    for (let i = spots.length - 1; i >= 0; i--) {
      if (Math.abs(mx - spots[i][0]) <= HANDLE / 2 && Math.abs(my - spots[i][1]) <= HANDLE / 2) {
        return i === 8 ? { kind: "rotate" } : { kind: "resize", idx: i };
      }
    }
  }
  const [wx, wy] = devToWorld(mx, my);
  for (let i = state.boxes.length - 1; i >= 0; i--) {
    const b = state.boxes[i];
    const [lx, ly] = boxWorldToLocal(b, wx, wy);
    if (Math.abs(lx) <= b.w / 2 && Math.abs(ly) <= b.h / 2) {
      return { kind: "box", i };
    }
  }
  return null;
}

cv.addEventListener("pointerdown", (e) => {
  if (!state.img) return;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const [wx, wy] = devToWorld(mx, my);
  if (e.ctrlKey || e.button === 1) {
    state.mode = "pan";
    state.drag = { x: e.clientX, y: e.clientY, vx: state.vx, vy: state.vy };
    return;
  }
  const hit = hitTest(mx, my);
  if (hit && hit.kind === "rotate") {
    state.mode = "rotate";
    state.drag = { i: state.sel, rot: state.boxes[state.sel].rot };
  } else if (hit && hit.kind === "resize") {
    state.mode = "resize";
    const b = state.boxes[state.sel];
    state.drag = { i: state.sel, idx: hit.idx, b: { ...b } };
  } else if (hit && hit.kind === "box") {
    state.sel = hit.i;
    state.mode = "move";
    const b = state.boxes[hit.i];
    state.drag = { i: hit.i, x: wx, y: wy, b: { ...b } };
    refreshList();
    requestRender();
  } else {
    state.sel = null;
    state.mode = "draw";
    state.boxes.push({ cx: wx, cy: wy, w: 0, h: 0, rot: 0, name: "", include: true });
    state.sel = state.boxes.length - 1;
    state.drag = { sx: wx, sy: wy };
    refreshList();
    requestRender();
  }
});

cv.addEventListener("pointermove", (e) => {
  if (!state.mode) return;
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const [wx, wy] = devToWorld(mx, my);
  if (state.mode === "pan") {
    state.vx = state.drag.vx + (e.clientX - state.drag.x);
    state.vy = state.drag.vy + (e.clientY - state.drag.y);
    requestRender();
    return;
  }
  if (state.mode === "draw") {
    const d = state.drag;
    const b = state.boxes[state.sel];
    if (!b) return;
    b.cx = clamp((d.sx + wx) / 2, 0, state.iw);
    b.cy = clamp((d.sy + wy) / 2, 0, state.ih);
    b.w = Math.abs(wx - d.sx);
    b.h = Math.abs(wy - d.sy);
    requestRender();
    return;
  }
  const b = state.boxes[state.drag.i];
  if (!b) return;
  if (state.mode === "move") {
    const d = state.drag;
    b.cx = d.b.cx + (wx - d.x);
    b.cy = d.b.cy + (wy - d.y);
    boxClampCenter(b);
    requestRender();
  } else if (state.mode === "resize") {
    const d = state.drag, idx = d.idx;
    const a = rad(d.b.rot);
    const cos = Math.cos(a), sin = Math.sin(a);
    const rx = wx - d.b.cx, ry = wy - d.b.cy;
    const lx = rx * cos + ry * sin;
    const ly = -rx * sin + ry * cos;
    let x0l = -d.b.w / 2, x1l = d.b.w / 2, y0l = -d.b.h / 2, y1l = d.b.h / 2;
    if (idx === 0 || idx === 3 || idx === 6) x0l = Math.min(lx, x1l - MIN_SZ);
    if (idx === 1 || idx === 2 || idx === 7) x1l = Math.max(lx, x0l + MIN_SZ);
    if (idx === 0 || idx === 1 || idx === 4) y0l = Math.min(ly, y1l - MIN_SZ);
    if (idx === 2 || idx === 3 || idx === 5) y1l = Math.max(ly, y0l + MIN_SZ);
    const newW = x1l - x0l, newH = y1l - y0l;
    const SX = [1, -1, -1, 1, 0, 0, 1, -1];
    const SY = [1, 1, -1, -1, 1, -1, 0, 0];
    const sx = SX[idx], sy = SY[idx];
    b.rot = d.b.rot;
    b.w = newW;
    b.h = newH;
    b.cx = d.b.cx + sx * ((d.b.w - newW) / 2) * cos - sy * ((d.b.h - newH) / 2) * sin;
    b.cy = d.b.cy + sx * ((d.b.w - newW) / 2) * sin + sy * ((d.b.h - newH) / 2) * cos;
    boxClampCenter(b);
    requestRender();
  } else if (state.mode === "rotate") {
    let rot = Math.atan2(wx - b.cx, -(wy - b.cy)) * 180 / Math.PI;
    rot = ((rot % 360) + 360) % 360;
    b.rot = Math.round(rot * 100) / 100;
    boxClampCenter(b);
    requestRender();
  }
  thumbDirty.add(state.drag.i);
  requestThumbs();
});

cv.addEventListener("pointerup", (e) => {
  if (!state.mode) return;
  if (state.mode === "draw") {
    const b = state.boxes[state.sel];
    if (b && (b.w < MIN_SZ || b.h < MIN_SZ)) {
      state.boxes.splice(state.sel, 1);
      state.sel = state.boxes.length ? Math.min(state.sel, state.boxes.length - 1) : null;
    }
    refreshList();
  }
  state.mode = null;
  state.drag = null;
  requestRender();
});

cv.addEventListener("wheel", (e) => {
  if (!state.img) return;
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const f = Math.exp(-e.deltaY * 0.0012);
  const ns = clamp(state.scale * f, 0.0001, 32);
  const wx = (mx - state.vx) / state.scale;
  const wy = (my - state.vy) / state.scale;
  state.vx = mx - wx * ns;
  state.vy = my - wy * ns;
  state.scale = ns;
  requestRender();
}, { passive: false });

cv.addEventListener("contextmenu", (e) => e.preventDefault());

window.addEventListener("keydown", (e) => {
  if (!state.img) return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "Delete" || e.key === "Backspace") {
    deleteSelected();
  } else if (e.key === "Escape") {
    state.sel = null;
    refreshList();
    requestRender();
  }
});

function deleteSelected() {
  if (state.sel === null) return;
  state.boxes.splice(state.sel, 1);
  state.sel = state.boxes.length ? Math.min(state.sel, state.boxes.length - 1) : null;
  refreshList();
  requestRender();
}

// ----------------------------------------------------------- auto-detect
els.detect.addEventListener("click", autoDetect);
els.clear.addEventListener("click", () => {
  state.boxes = [];
  state.sel = null;
  refreshList();
  requestRender();
  status("Cleared all boxes.");
});

async function autoDetect() {
  if (!state.img) return;
  status("Detecting photos…");
  const max = Math.max(state.iw, state.ih);
  const scale = DETECT_MAX / max;
  const dw = Math.max(1, Math.round(state.iw * scale));
  const dh = Math.max(1, Math.round(state.ih * scale));
  const overview = await createImageBitmap(state.img, { resizeWidth: dw, resizeHeight: dh });
  const oc = new OffscreenCanvas(dw, dh);
  const octx = oc.getContext("2d");
  octx.drawImage(overview, 0, 0);
  overview.close();
  const data = octx.getImageData(0, 0, dw, dh).data;

  const mask = new Uint8Array(dw * dh);
  for (let i = 0, j = 0; i < mask.length; i++, j += 4) {
    const lum = data[j] * 0.299 + data[j + 1] * 0.587 + data[j + 2] * 0.114;
    mask[i] = lum < THRESH ? 1 : 0;
  }
  erode(mask, dw, dh);
  dilate(mask, dw, dh);

  const labels = new Int32Array(dw * dh).fill(-1);
  const comps = [];
  let stack = [];
  for (let i = 0; i < mask.length; i++) {
    if (mask[i] && labels[i] < 0) {
      const id = comps.length;
      let minX = dw, minY = dh, maxX = -1, maxY = -1, area = 0;
      stack = [i];
      labels[i] = id;
      while (stack.length) {
        const p = stack.pop();
        area++;
        const x = p % dw, y = (p / dw) | 0;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        const n = y > 0 ? p - dw : -1;
        const s = y < dh - 1 ? p + dw : -1;
        const w = x > 0 ? p - 1 : -1;
        const e = x < dw - 1 ? p + 1 : -1;
        for (const q of [n, s, w, e]) {
          if (q >= 0 && mask[q] && labels[q] < 0) { labels[q] = id; stack.push(q); }
        }
      }
      comps.push({ minX, minY, maxX, maxY, area });
    }
  }

  const total = dw * dh;
  const minArea = Math.max(30, MIN_AREA_FRAC * total);
  const minSide = MIN_SIDE_FRAC * Math.min(dw, dh);
  let sel = comps.filter((c) => c.area >= minArea && Math.min(c.maxX - c.minX, c.maxY - c.minY) >= minSide);

  const gap = MERGE_GAP_FRAC * Math.min(dw, dh);
  let changed = true;
  while (changed) {
    changed = false;
    outer:
    for (let i = 0; i < sel.length; i++) {
      for (let j = i + 1; j < sel.length; j++) {
        const a = sel[i], b = sel[j];
        if (a.minX - gap <= b.maxX && b.minX - gap <= a.maxX &&
            a.minY - gap <= b.maxY && b.minY - gap <= a.maxY) {
          a.minX = Math.min(a.minX, b.minX);
          a.minY = Math.min(a.minY, b.minY);
          a.maxX = Math.max(a.maxX, b.maxX);
          a.maxY = Math.max(a.maxY, b.maxY);
          sel.splice(j, 1);
          changed = true;
          break outer;
        }
      }
    }
  }

  const fx = state.iw / dw, fy = state.ih / dh;
  state.boxes = [];
  for (const c of sel) {
    const bw = (c.maxX - c.minX + 1) * fx;
    const bh = (c.maxY - c.minY + 1) * fy;
    const mx = MARGIN_FRAC * bw, my = MARGIN_FRAC * bh;
    const x0 = clamp(Math.round(c.minX * fx - mx), 0, state.iw);
    const y0 = clamp(Math.round(c.minY * fy - my), 0, state.ih);
    const x1 = clamp(Math.round((c.maxX + 1) * fx + mx), 0, state.iw);
    const y1 = clamp(Math.round((c.maxY + 1) * fy + my), 0, state.ih);
    state.boxes.push({ cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0, rot: 0, name: "", include: true });
  }
  state.sel = state.boxes.length ? 0 : null;
  refreshList();
  requestRender();
  status(`Detected ${state.boxes.length} photo(s). Adjust the boxes or draw your own.`);
}

function erode(mask, w, h) {
  const out = new Uint8Array(mask);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      if (mask[i] && !(mask[i - 1] && mask[i + 1] && mask[i - w] && mask[i + w])) out[i] = 0;
    }
  }
  mask.set(out);
}
function dilate(mask, w, h) {
  const out = new Uint8Array(mask);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      if (!mask[i] && (mask[i - 1] || mask[i + 1] || mask[i - w] || mask[i + w])) out[i] = 1;
    }
  }
  mask.set(out);
}

// ---------------------------------------------------------------- list
function refreshList() {
  els.list.textContent = "";
  items = [];
  if (!state.boxes.length) {
    const d = document.createElement("div");
    d.className = "empty-hint";
    d.textContent = "No crops yet. Draw a box on the scan or use Auto-detect.";
    els.list.appendChild(d);
    return;
  }
  state.boxes.forEach((b, i) => {
    const item = document.createElement("div");
    item.className = "item" + (i === state.sel ? " sel" : "") + (b.include ? "" : " excluded");

    const top = document.createElement("div");
    top.className = "item-top";
    const thumb = document.createElement("canvas");
    thumb.width = 132;
    thumb.height = 132;
    const info = document.createElement("div");
    info.className = "item-info";

    const name = document.createElement("input");
    name.type = "text";
    name.value = b.name;
    name.placeholder = "photo-" + (i + 1);
    name.title = "Output filename";
    name.addEventListener("input", () => {
      b.name = name.value;
      requestRender();
    });
    name.addEventListener("click", (e) => e.stopPropagation());

    const rotRow = document.createElement("div");
    rotRow.className = "rot-row";
    const rotLbl = document.createElement("span");
    const updRot = () => { rotLbl.textContent = `Rotation: ${fmtDeg(b.rot)}°`; };
    updRot();
    const rotActs = document.createElement("span");
    rotActs.className = "rot-actions";
    const mk = (txt, fn) => {
      const btn = document.createElement("button");
      btn.textContent = txt;
      btn.addEventListener("click", (e) => { e.stopPropagation(); fn(); });
      return btn;
    };
    rotActs.appendChild(mk("−0.1°", () => { b.rot = (b.rot - 0.1 + 360) % 360; updateThumb(i); updRot(); requestRender(); }));
    rotActs.appendChild(mk("+0.1°", () => { b.rot = (b.rot + 0.1) % 360; updateThumb(i); updRot(); requestRender(); }));
    rotActs.appendChild(mk("↺ 90°", () => { b.rot = (b.rot - 90 + 360) % 360; updateThumb(i); updRot(); requestRender(); }));
    rotActs.appendChild(mk("180°", () => { b.rot = (b.rot + 180) % 360; updateThumb(i); updRot(); requestRender(); }));
    rotActs.appendChild(mk("↻ 90°", () => { b.rot = (b.rot + 90) % 360; updateThumb(i); updRot(); requestRender(); }));
    rotRow.appendChild(rotLbl);
    rotRow.appendChild(rotActs);

    const foot = document.createElement("div");
    foot.className = "item-foot";
    const inclLbl = document.createElement("label");
    const incl = document.createElement("input");
    incl.type = "checkbox";
    incl.checked = b.include;
    incl.addEventListener("change", () => {
      b.include = incl.checked;
      item.classList.toggle("excluded", !b.include);
    });
    incl.addEventListener("click", (e) => e.stopPropagation());
    inclLbl.appendChild(incl);
    inclLbl.appendChild(document.createTextNode(" Include"));
    const del = document.createElement("button");
    del.textContent = "Delete";
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      state.boxes.splice(i, 1);
      state.sel = state.boxes.length ? Math.min(state.sel ?? 0, state.boxes.length - 1) : null;
      refreshList();
      requestRender();
    });
    foot.appendChild(inclLbl);
    foot.appendChild(del);

    info.appendChild(name);
    info.appendChild(rotRow);
    info.appendChild(foot);
    top.appendChild(thumb);
    top.appendChild(info);

    item.addEventListener("click", () => {
      state.sel = i;
      refreshList();
      requestRender();
    });

    item.appendChild(top);
    els.list.appendChild(item);
    items.push({ item, thumb, rotLbl, b, i });
  });
  items.forEach((it) => thumbDirty.add(it.i));
  requestThumbs();
}

function requestThumbs() {
  if (thumbDirty.size) requestAnimationFrame(paintThumbs);
}
let paintingThumbs = false;
function paintThumbs() {
  if (paintingThumbs) return;
  paintingThumbs = true;
  const todo = [...thumbDirty];
  thumbDirty.clear();
  todo.forEach((i) => updateThumb(i));
  paintingThumbs = false;
}
function boxSourceBounds(b) {
  const points = [
    boxLocalToWorld(b, -b.w / 2, -b.h / 2),
    boxLocalToWorld(b, b.w / 2, -b.h / 2),
    boxLocalToWorld(b, b.w / 2, b.h / 2),
    boxLocalToWorld(b, -b.w / 2, b.h / 2),
  ];
  const sx = clamp(Math.floor(Math.min(...points.map((p) => p[0]))), 0, state.iw);
  const sy = clamp(Math.floor(Math.min(...points.map((p) => p[1]))), 0, state.ih);
  const ex = clamp(Math.ceil(Math.max(...points.map((p) => p[0]))), 0, state.iw);
  const ey = clamp(Math.ceil(Math.max(...points.map((p) => p[1]))), 0, state.ih);
  return [sx, sy, Math.max(1, ex - sx), Math.max(1, ey - sy)];
}

function drawBoxCrop(target, b, centerX, centerY, scaleX, scaleY) {
  const [sx, sy, sw, sh] = boxSourceBounds(b);
  target.save();
  target.translate(centerX, centerY);
  target.scale(scaleX, scaleY);
  target.rotate(-rad(b.rot));
  target.translate(-b.cx, -b.cy);
  target.drawImage(state.img, sx, sy, sw, sh, sx, sy, sw, sh);
  target.restore();
}

function updateThumb(i) {
  const it = items[i];
  if (!it) return;
  const b = state.boxes[i];
  if (!b) return;
  const tctx = it.thumb.getContext("2d");
  const TW = it.thumb.width, TH = it.thumb.height;
  tctx.clearRect(0, 0, TW, TH);
  if (!b.w || !b.h) return;
  const s = Math.min(TW / b.w, TH / b.h) * 0.92;
  tctx.fillStyle = "#ffffff";
  tctx.fillRect(0, 0, TW, TH);
  tctx.imageSmoothingEnabled = true;
  tctx.imageSmoothingQuality = "high";
  drawBoxCrop(tctx, b, TW / 2, TH / 2, s, s);
}

// ---------------------------------------------------------------- export
els.quality.addEventListener("input", () => {
  els.qval.textContent = els.quality.value;
});

function sanitizeName(s) {
  return (s || "").replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim().slice(0, 120);
}
function uniqueName(used, base, ext) {
  let n = 1;
  let name = (base || "photo") + ext;
  while (used.has(name)) {
    n++;
    name = `${base || "photo"}-${n}${ext}`;
  }
  used.add(name);
  return name;
}

els.export.addEventListener("click", exportAll);

async function cropToBlob(b, fmt, quality) {
  const w = Math.max(1, Math.round(b.w)), h = Math.max(1, Math.round(b.h));
  const c = new OffscreenCanvas(w, h);
  const cctx = c.getContext("2d");
  cctx.fillStyle = "#ffffff";
  cctx.fillRect(0, 0, w, h);
  cctx.imageSmoothingEnabled = true;
  cctx.imageSmoothingQuality = "high";
  drawBoxCrop(cctx, b, w / 2, h / 2, w / b.w, h / b.h);
  if (fmt === "jpeg") {
    return await c.convertToBlob({ type: "image/jpeg", quality });
  }
  return await c.convertToBlob({ type: "image/png" });
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function exportAll() {
  const inc = state.boxes.map((b, i) => ({ b, i })).filter((x) => x.b.include);
  if (!inc.length) {
    status("Nothing to export — no boxes are marked as included.");
    return;
  }
  const fmt = els.fmt.value;
  const quality = parseInt(els.quality.value, 10) / 100;
  const ext = fmt === "jpeg" ? ".jpg" : ".png";

  let dir = null;
  if (window.showDirectoryPicker) {
    try { dir = await window.showDirectoryPicker(); }
    catch (e) { status("Export cancelled."); return; }
  }

  const used = new Set();
  let done = 0;
  els.export.disabled = true;
  status(`Exporting 0/${inc.length}…`);
  try {
    for (const { b, i } of inc) {
      const base = sanitizeName(b.name);
      const name = uniqueName(used, base, ext);
      const blob = await cropToBlob(b, fmt, quality);
      if (dir) {
        const fh = await dir.getFileHandle(name, { create: true });
        const wr = await fh.createWritable();
        await wr.write(blob);
        await wr.close();
      } else {
        downloadBlob(blob, name);
      }
      done++;
      status(`Exporting ${done}/${inc.length}…`);
    }
      status(dir ? `Exported ${done} file(s) to the chosen folder.` : `Exported ${done} file(s) as downloads.`);
  } catch (e) {
    status("Export failed: " + e.message);
  } finally {
    els.export.disabled = false;
  }
}

})();
</script>
</body>
