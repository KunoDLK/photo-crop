<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book viewer</title>
<style>
:root {
  --bg: #f2f2f2;
  --text: #1f1f1f;
  --muted: #6b6b6b;
  --border: #d4d4d4;
  --accent: #1ca7e8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b1f;
    --text: #e8e8ea;
    --muted: #9a9aa2;
    --border: #3a3a42;
    --accent: #4fb8ee;
  }
}
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
}
body { display: flex; flex-direction: column; overflow: hidden; }
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.toolbar button {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
}
.toolbar button:hover { background: var(--border); }
.title { font-weight: 600; }
.spacer { flex: 1; }
.zoom-lbl { color: var(--muted); font-variant-numeric: tabular-nums; }
.left {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  background: #808080;
}
#view {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
#view:active { cursor: grabbing; }
.stats {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 4px 10px;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  z-index: 5;
}
#status {
  flex: 0 0 auto;
  padding: 5px 12px;
  font-size: 12px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  background: var(--bg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
<body>

<div class="toolbar">
  <span class="title">Book viewer</span>
  <button id="btn-reload">Reload</button>
  <button id="btn-fit">Fit</button>
  <button id="btn-tiledbg">Tile debug: off</button>
  <div class="spacer"></div>
  <span class="zoom-lbl" id="zoom-lbl">—</span>
</div>

<div class="left" id="left">
  <canvas id="view"></canvas>
  <div class="stats" id="stats" hidden></div>
</div>

<div id="status">Loading…</div>

<script>
(() => {
"use strict";

// ------------------------------------------------------------- constants
const TILE = 256;
const TILE_BYTES = TILE * TILE * 4; // RGBA bytes per tile (worker always emits TILE×TILE)
const CACHE_MAX = 1024;
const MAX_ACTIVE = 12;      // upper bound on concurrently resident sources
const MAX_SRC_LOADS = 2;    // max parallel source decodes
const MAX_INFLIGHT = 6;
const SETTLE_MS = 180;
const DOWNLOAD_GAP_MS = 400;   // pause between sequential image downloads
const IMG_EXT = /\.(png|jpe?g|tiff?|bmp|webp|gif|avif)$/i;
const NAME_RE = /^(\d+)_(\d+)-(.*)$/;

// layout metrics (in scene / CSS px @ scale 1)
const CELL = 1600;            // square cell side reserved per image
const CELL_GAP = 120;         // gap between cells within a group
const GROUP_GAP = 480;        // extra gap between groups
const LABEL_H = 90;           // label region height above each cell
const LABEL_FONT = 56;        // label font size

const els = {
  view: document.getElementById("view"),
  left: document.getElementById("left"),
  zoom: document.getElementById("zoom-lbl"),
  status: document.getElementById("status"),
  reload: document.getElementById("btn-reload"),
  fit: document.getElementById("btn-fit"),
  tiledbg: document.getElementById("btn-tiledbg"),
  stats: document.getElementById("stats"),
};

const cv = els.view;
const ctx = cv.getContext("2d");
let dpr = window.devicePixelRatio || 1;

// ------------------------------------------------------------- view state
const view = { scale: 1, vx: 0, vy: 0, fitScale: 1 };
const scene = { w: 0, h: 0 };   // total scene bounds
let images = [];                // all placed images
let needRender = false;
let tileDebug = false;
let interacting = false;
let settleTimer = null;
let stateHasImages = false;
let loadGeneration = 0;        // bumped on reload; invalidates stale decode callbacks
let avgSourceBytes = 0;         // running estimate of a full-res source's size
let sourceLoadCount = 0;        // in-flight source decodes
const sourceLoading = new Set(); // image ids awaiting a source decode/ack
const sourceFailedAt = new Map(); // id -> timestamp of last failed decode
// last known cursor position in canvas (device/CSS) coords; -1 = unknown/off
let cursorX = -1, cursorY = -1;

// ------------------------------------------------------------- profiler
// Simple per-operation timing profiler. Each frame accumulates the time spent
// in each named operation; every PROFILE_EVERY frames it logs an average +
// max to the console so we can find the hot spots.
const PROFILE_EVERY = 60;
const profAcc = new Map(); // name -> { n, sum, max }
let profFrames = 0;
// per-level tile generation timing from the worker
const tileTiming = new Map(); // "L:quality" -> { n, sum, max }
let tileTimingFrames = 0;
// queue debug logging
const QUEUE_DEBUG = false;
const CACHE_DEBUG = false;
function queueLog(msg) { if (QUEUE_DEBUG) console.log("[queue] " + msg); }
function cacheLog(msg) { if (CACHE_DEBUG) console.log("[cache] " + msg); }

// ------------------------------------------------- device / memory hints
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");
const deviceMemoryGB = navigator.deviceMemory || (isMobile ? 4 : 16);
// Budget for full-res source bitmaps held in the worker, proportional to RAM.
// Approx 160MB per GB of RAM, clamped to a sane range.
const sourceBudgetMB = clamp(Math.round(deviceMemoryGB * 160), 320, 3 * 1024);
const SOURCE_BUDGET = sourceBudgetMB * 1024 * 1024;
// Tile cache byte budget, scaled by RAM (256KB/tile). Protects low-memory phones
// from holding thousands of decoded tiles; protected base tiles are excluded.
const CACHE_MAX_BYTES = Math.max(64 * 1024 * 1024, Math.round(deviceMemoryGB * 64 * 1024 * 1024));
// High-RAM devices keep blobs in RAM; low-RAM (phones) use IndexedDB.
const USE_RAM_CACHE = deviceMemoryGB >= 8 || !isMobile;

// ---------------------------------------------------------- blob cache
// App-level blob cache (copyparty sends no-store, so the browser never caches
// /private/ images). Adaptive: RAM Map on high-memory devices, IndexedDB on
// low-memory phones (disk-backed, survives restarts, LRU-capped).
const ramBlobs = new Map(); // url -> { blob, lastUsed, size }
const IDB_NAME = "bookviewer-cache";
const IDB_STORE = "blobs";
let idb = null;
async function idbOpen() {
  if (!("indexedDB" in window)) return null;
  if (idb) return idb;
  try {
    idb = await new Promise((res, rej) => {
      const r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) {
          db.createObjectStore(IDB_STORE, { keyPath: "url" });
        }
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  } catch (e) { idb = null; }
  return idb;
}
async function idbGet(url) {
  const db = await idbOpen();
  if (!db) return null;
  try {
    return await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).get(url);
      req.onsuccess = () => res(req.result ? req.result.blob : null);
      req.onerror = () => rej(req.error);
    });
  } catch (e) { return null; }
}
async function idbPut(url, blob) {
  const db = await idbOpen();
  if (!db) return;
  try {
    await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put({ url, blob, lastUsed: Date.now(), size: blob.size });
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
    await idbTrim();
  } catch (e) { /* quota / unavailable: degrade to no cache */ }
}
async function idbTrim() {
  const db = await idbOpen();
  if (!db) return;
  try {
    // cap at ~max(128MB, 1/4 of quota)
    let quota = 512 * 1024 * 1024;
    try { if (navigator.storage && navigator.storage.estimate) quota = (await navigator.storage.estimate()).quota || quota; } catch (e) {}
    const cap = Math.max(128 * 1024 * 1024, Math.floor(quota / 4));
    let total = 0;
    const rows = await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
    rows.sort((a, b) => (a.lastUsed || 0) - (b.lastUsed || 0));
    for (const r of rows) total += r.size || 0;
    if (total <= cap) return;
    for (const r of rows) {
      if (total <= cap) break;
      await new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).delete(r.url);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
      total -= r.size || 0;
      cacheLog(`idb evict ${r.url} (${(r.size / 1048576).toFixed(1)}MB)`);
    }
  } catch (e) {}
}

// Read a cached blob for a url, or null. Updates LRU on hit.
async function blobCacheGet(url) {
  if (USE_RAM_CACHE) {
    const e = ramBlobs.get(url);
    if (e) { e.lastUsed = Date.now(); return e.blob; }
  } else {
    const b = await idbGet(url);
    if (b) return b;
  }
  return null;
}
// Store a blob. Returns nothing (fire-and-forget).
async function blobCachePut(url, blob) {
  if (USE_RAM_CACHE) {
    const prev = ramBlobs.get(url);
    ramBlobs.set(url, { blob, lastUsed: Date.now(), size: blob.size });
    // cap RAM cache at ~max(256MB, deviceMemoryGB*256MB)
    const cap = Math.max(256 * 1024 * 1024, deviceMemoryGB * 256 * 1024 * 1024);
    let total = [...ramBlobs.values()].reduce((s, e) => s + (e.size || 0), 0);
    if (total > cap) {
      const sorted = [...ramBlobs.entries()].sort((a, b) => a[1].lastUsed - b[1].lastUsed);
      for (const [u, e] of sorted) {
        if (total <= cap) break;
        ramBlobs.delete(u);
        total -= e.size || 0;
        cacheLog(`ram evict ${u} (${(e.size / 1048576).toFixed(1)}MB)`);
      }
    }
    if (prev) cacheLog(`ram replace ${url}`);
  } else {
    await idbPut(url, blob);
  }
}
function profStart(name) { return { name, t: performance.now() }; }
function profEnd(m) {
  const dt = performance.now() - m.t;
  let e = profAcc.get(m.name);
  if (!e) { e = { n: 0, sum: 0, max: 0 }; profAcc.set(m.name, e); }
  e.n++; e.sum += dt; if (dt > e.max) e.max = dt;
}
function profFrame() {
  if (++profFrames < PROFILE_EVERY) return;
  const parts = [];
  for (const [name, e] of profAcc) {
    parts.push(`${name}: avg=${(e.sum / e.n).toFixed(2)}ms max=${e.max.toFixed(2)}ms (${e.n})`);
  }
  profAcc.clear();
  profFrames = 0;
  // per-level tile timing
  const tparts = [];
  for (const [key, e] of tileTiming) {
    tparts.push(`${key}: avg=${(e.sum / e.n).toFixed(2)}ms max=${e.max.toFixed(2)}ms (${e.n})`);
  }
  tileTiming.clear();
  tileTimingFrames = 0;
  console.log("[perf] " + (parts.length ? parts.join("  ") : "(no ops)"));
  if (tparts.length) console.log("[tiles] " + tparts.join("  "));
}
function recordTileTime(L, quality, ms) {
  const key = "L" + L + (quality === "low" ? "-low" : "-high");
  let e = tileTiming.get(key);
  if (!e) { e = { n: 0, sum: 0, max: 0 }; tileTiming.set(key, e); }
  e.n++; e.sum += ms; if (ms > e.max) e.max = ms;
}

function status(msg) { els.status.textContent = msg; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ---------------------------------------------------------- copyparty auth
// iOS Safari drops copyparty's SameSite=Strict HttpOnly session cookie on
// programmatic fetches, causing intermittent 403s. To be robust we send the
// password explicitly via the `PW:` header (and ?pw= as a fallback). The
// password is taken from ?pw= in the page URL, or a one-time prompt cached in
// sessionStorage. Never hardcoded.
let cpPw = (() => {
  const u = new URLSearchParams(location.search).get("pw");
  if (u) { try { sessionStorage.setItem("cppw", u); } catch (e) {} return u; }
  try { return sessionStorage.getItem("cppw") || ""; } catch (e) { return ""; }
})();
function promptForPw() {
  const v = (prompt(
    "Session expired / not authorized.\n" +
    "Enter copyparty password (or user:password) to load images:") || "").trim();
  if (v) { cpPw = v; try { sessionStorage.setItem("cppw", v); } catch (e) {} }
  return v;
}
async function cpFetch(url, opts) {
  opts = Object.assign({ credentials: "include" }, opts || {});
  const headers = new Headers(opts.headers || {});
  if (cpPw) headers.set("PW", cpPw);
  opts.headers = headers;
  let res = await fetch(url, opts);
  if (res.status === 403) {
    // cookie wasn't accepted; ask for a password and retry once
    if (promptForPw()) {
      headers.set("PW", cpPw);
      res = await fetch(url, opts);
    }
  }
  return res;
}

function requestRender() {
  if (needRender) return;
  needRender = true;
  requestAnimationFrame(render);
}
function markInteracting() {
  interacting = true;
  if (settleTimer) clearTimeout(settleTimer);
  settleTimer = setTimeout(() => {
    settleTimer = null;
    interacting = false;
    reconcile();
    requestRender();
  }, SETTLE_MS);
  reconcile();
}

// ------------------------------------------------------------- canvas size
function resizeCanvas() {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
}
new ResizeObserver(() => { resizeCanvas(); reconcile(); requestRender(); }).observe(els.left);
resizeCanvas();

// ------------------------------------------------------------- tile worker
const workerSupported = typeof Worker !== "undefined" &&
  typeof OffscreenCanvas !== "undefined" &&
  typeof createImageBitmap !== "undefined";

const WORKER_SRC = `
const DEBUG = false;
const sources = new Map(); // id -> {img, iw, ih, bytes, lastUsed}
const sourceOrder = [];     // LRU order of source ids (most-recent at end)
let TILE = 256;
let srcBudget = 512 * 1024 * 1024; // total bytes of source bitmaps allowed
let srcBytes = 0;                  // current sum of source bytes

function sourceUsed(id) {
  const i = sourceOrder.indexOf(id);
  if (i >= 0) { sourceOrder.splice(i, 1); sourceOrder.push(id); }
}
function evictSources() {
  while (srcBytes > srcBudget && sourceOrder.length > 1) {
    const id = sourceOrder.shift();
    const s = sources.get(id);
    if (!s) continue;
    if (s.img && s.img.close) s.img.close();
    sources.delete(id);
    srcBytes -= s.bytes;
    self.postMessage({ type: "sourceEvicted", id });
  }
}
function downscaleHQ(src, sx, sy, sw, sh, dw, dh) {
  let cur = new OffscreenCanvas(Math.max(1, Math.round(sw)), Math.max(1, Math.round(sh)));
  let cg = cur.getContext("2d");
  cg.imageSmoothingEnabled = true; cg.imageSmoothingQuality = "high";
  cg.drawImage(src, sx, sy, sw, sh, 0, 0, cur.width, cur.height);
  let cw = cur.width, ch = cur.height;
  while (cw > dw * 2 || ch > dh * 2) {
    const nw = Math.max(dw, Math.floor(cw / 2));
    const nh = Math.max(dh, Math.floor(ch / 2));
    const next = new OffscreenCanvas(nw, nh);
    const ng = next.getContext("2d");
    ng.imageSmoothingEnabled = true; ng.imageSmoothingQuality = "high";
    ng.drawImage(cur, 0, 0, cw, ch, 0, 0, nw, nh);
    cur = next; cw = nw; ch = nh;
  }
  const out = new OffscreenCanvas(dw, dh);
  const og = out.getContext("2d");
  og.imageSmoothingEnabled = true; og.imageSmoothingQuality = "high";
  og.drawImage(cur, 0, 0, cw, ch, 0, 0, dw, dh);
  return out;
}
self.onmessage = (e) => {
  const m = e.data;
  if (m.type === "cfg") {
    TILE = m.TILE; if (m.srcBudget) srcBudget = m.srcBudget; return;
  }
  if (m.type === "addSource") {
    const existing = sources.get(m.id);
    if (existing && existing.img && existing.img.close) existing.img.close();
    const bytes = m.iw * m.ih * 4;
    sources.set(m.id, { img: m.bitmap, iw: m.iw, ih: m.ih, bytes, lastUsed: performance.now() });
    const i = sourceOrder.indexOf(m.id);
    if (i >= 0) sourceOrder.splice(i, 1);
    sourceOrder.push(m.id);
    srcBytes += bytes;
    evictSources();
    self.postMessage({ type: "sourceReady", id: m.id });
    if (DEBUG) console.log("[worker] addSource", m.id, m.iw + "x" + m.ih, "srcBytes", (srcBytes / 1048576).toFixed(1) + "MB");
    return;
  }
  if (m.type === "clear") {
    for (const s of sources.values()) { if (s.img && s.img.close) s.img.close(); }
    sources.clear();
    sourceOrder.length = 0;
    srcBytes = 0;
    return;
  }
  if (m.type === "gen") {
    const s = sources.get(m.id);
    if (!s) {
      // source was evicted; tell the main thread so it can drop the inflight
      // entry (otherwise the queue stalls forever)
      self.postMessage({ type: "genSkipped", id: m.id, L: m.L, tx: m.tx, ty: m.ty, quality: m.quality });
      if (DEBUG) console.log("[worker] genSkipped(no source) L" + m.L + (m.quality === "low" ? "-low" : "") + " " + m.id + ":" + m.tx + "," + m.ty);
      return;
    }
    sourceUsed(m.id);
    const t0 = performance.now();
    const { L, tx, ty, quality } = m;
    const p = Math.pow(2, L);
    const sx = tx * TILE * p, sy = ty * TILE * p;
    const sw = Math.min(TILE * p, s.iw - sx);
    const sh = Math.min(TILE * p, s.ih - sy);
    if (sw <= 0 || sh <= 0) {
      self.postMessage({ type: "genSkipped", id: m.id, L, tx, ty, quality });
      if (DEBUG) console.log("[worker] genSkipped(bad rect) L" + L + " " + m.id + ":" + tx + "," + ty);
      return;
    }
    const dw = Math.max(1, Math.round(sw / p));
    const dh = Math.max(1, Math.round(sh / p));
    const c = new OffscreenCanvas(TILE, TILE);
    const g = c.getContext("2d");
    if (quality === "low") {
      g.imageSmoothingEnabled = false;
      g.drawImage(s.img, sx, sy, sw, sh, 0, 0, dw, dh);
    } else {
      const out = downscaleHQ(s.img, sx, sy, sw, sh, dw, dh);
      g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
      g.drawImage(out, 0, 0, dw, dh, 0, 0, dw, dh);
    }
    const bmp = c.transferToImageBitmap();
    self.postMessage(
      { type: "tile", id: m.id, L, tx, ty, quality, bitmap: bmp, ms: performance.now() - t0 },
      [bmp]);
    if (DEBUG) console.log("[worker] tile done L" + L + (quality === "low" ? "-low" : "") + " " + m.id + ":" + tx + "," + ty + " " + (performance.now() - t0).toFixed(1) + "ms");
  }
};
`;

let tileWorker = null;
let workerReady = false;
const cache = new Map();          // key "id:L:tx:ty" -> {img,L,quality,lastUsed,id}
let cacheBytes = 0;               // sum of decoded tile bytes held in the cache
let tileClock = 0;
const inflight = new Set();        // "id:L:tx:ty:quality"
const queued = [];                 // {id,L,tx,ty,quality,rk}
const readySources = new Set();    // image ids whose worker source is ready

function initWorker() {
  if (!workerSupported) return;
  const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
  tileWorker = new Worker(url);
  URL.revokeObjectURL(url);
  tileWorker.postMessage({ type: "cfg", TILE, srcBudget: SOURCE_BUDGET });
  workerReady = true;
  tileWorker.onmessage = (e) => {
    const m = e.data;
    if (m.type === "sourceReady") {
      queueLog(`sourceReady ${m.id}`);
      readySources.add(m.id);
      sourceLoading.delete(m.id);
      sourceFailedAt.delete(m.id);
      const im = imgById.get(m.id);
      if (im) requestBaseTiles(im);
      reconcile();
      requestRender();
      return;
    }
    if (m.type === "sourceEvicted") {
      queueLog(`sourceEvicted ${m.id}`);
      readySources.delete(m.id);
      return;
    }
    if (m.type === "genSkipped") {
      // Worker couldn't build this tile (source evicted). Drop the inflight
      // entry and re-run the scheduler so it reloads the source if the image is
      // still inside the active window.
      const rk = m.id + ":" + m.L + ":" + m.tx + ":" + m.ty + ":" + m.quality;
      inflight.delete(rk);
      queueLog(`genSkipped ${rk}  inflight=${inflight.size}/${MAX_INFLIGHT}`);
      reconcile();
      return;
    }
    if (m.type === "tile") {
      const tTile = profStart("msg.tileReceived");
      if (m.ms) recordTileTime(m.L, m.quality, m.ms);
      const rk = m.id + ":" + m.L + ":" + m.tx + ":" + m.ty + ":" + m.quality;
      inflight.delete(rk);
      queueLog(`tile in ${m.ms != null ? m.ms.toFixed(1) + "ms" : "?"} L${m.L}${m.quality === "low" ? "-low" : ""} ${m.id}:${m.tx},${m.ty}`);
      const k = tileKey(m.id, m.L, m.tx, m.ty);
      const existing = cache.get(k);
      if (!(existing && existing.quality === "high" && m.quality !== "high")) {
        cacheSet(k, m.bitmap, m.id, m.L, m.quality);
      } else if (m.bitmap.close) {
        m.bitmap.close();
      }
      pumpQueue();
      // When the queue and in-flight set both drain, re-run the scheduler to
      // advance the active window onto the next-priority images.
      if (queued.length === 0 && inflight.size === 0) reconcile();
      requestRender();
      profEnd(tTile);
    }
  };
}
initWorker();

function addSource(im) {
  if (!workerSupported) { readySources.add(im.id); return; }
  // Transfer the decoded bitmap to the worker (no clone) so we keep only ONE
  // full-res copy per image - avoids doubling memory (the 3-image phone crash).
  tileWorker.postMessage(
    { type: "addSource", id: im.id, bitmap: im.bitmap, iw: im.iw, ih: im.ih }, [im.bitmap]);
  im.bitmap = null; // ownership moved to the worker
}

// Re-decode a source from the cached blob so the worker can generate its tiles.
// Returns true once the source has been transferred to the worker.
const redecoding = new Set();
async function ensureSource(im) {
  if (readySources.has(im.id) || redecoding.has(im.id)) return true;
  if (im.status !== "loaded") return false;
  redecoding.add(im.id);
  try {
    const blob = await blobCacheGet(im.url);
    if (!blob) return false;
    const bmp = await createImageBitmap(blob);
    im.bitmap = bmp;
    addSource(im);
    return true;
  } catch (e) {
    cacheLog(`re-decode failed ${im.url}: ${e.message}`);
    return false;
  } finally {
    redecoding.delete(im.id);
  }
}

// ------------------------------------------------------------- tile cache
function tileKey(id, L, tx, ty) { return id + ":" + L + ":" + tx + ":" + ty; }
function isProtected(entry) {
  const im = imgById.get(entry.id);
  if (!im) return false;
  return entry.L >= im.maxLevel; // pin each image's coarsest whole-image base
}
function cacheGet(k) {
  const v = cache.get(k);
  if (!v) return null;
  v.lastUsed = ++tileClock;
  return v;
}
function cacheSet(k, img, id, L, quality) {
  const prev = cache.get(k);
  if (prev && prev.img && prev.img.close && prev.img !== img) prev.img.close();
  cache.set(k, { img, id, L, quality, lastUsed: ++tileClock });
  if (!prev) cacheBytes += TILE_BYTES;
  while (cache.size > CACHE_MAX || cacheBytes > CACHE_MAX_BYTES) {
    let victimKey = null, victimTime = Infinity;
    for (const [key, val] of cache.entries()) {
      if (isProtected(val)) continue;
      if (val.lastUsed < victimTime) { victimTime = val.lastUsed; victimKey = key; }
    }
    if (victimKey === null) break;
    const ev = cache.get(victimKey);
    if (ev && ev.img && ev.img.close) ev.img.close();
    cache.delete(victimKey);
    cacheBytes -= TILE_BYTES;
  }
}
function cacheHasHigh(k) { const v = cache.get(k); return !!(v && v.quality === "high"); }

// ------------------------------------------------------------- tile queue
function pumpQueue() {
  if (!workerSupported || !workerReady) return;
  while (inflight.size < MAX_INFLIGHT && queued.length) {
    const req = queued.shift();
    if (inflight.has(req.rk)) {
      queueLog(`drop(inflight dup) ${req.rk}  queued=${queued.length}`);
      continue;
    }
    if (!readySources.has(req.id)) {
      // Source not ready yet (being decoded / evicted). Do NOT drop the request
      // forever - put it back at the front and stop draining, so it is sent once
      // the source becomes ready (sourceReady -> pumpQueue).
      queueLog(`defer(no source) ${req.rk}  srcReady=${[...readySources]}  queued=${queued.length}`);
      queued.unshift(req);
      break;
    }
    inflight.add(req.rk);
    queueLog(`send ${req.rk}  [inflight=${inflight.size}/${MAX_INFLIGHT} queued=${queued.length}]`);
    tileWorker.postMessage({ type: "gen", id: req.id, L: req.L, tx: req.tx, ty: req.ty, quality: req.quality });
  }
  if (inflight.size >= MAX_INFLIGHT && queued.length) {
    queueLog(`STALL inflight=${inflight.size}/${MAX_INFLIGHT} queued=${queued.length} [${[...inflight].slice(0, 8).join(",")}]`);
  }
}
function requestTile(id, L, tx, ty, quality) {
  if (!readySources.has(id)) return;
  const rk = id + ":" + L + ":" + tx + ":" + ty + ":" + quality;
  if (inflight.has(rk)) return;
  if (queued.some((q) => q.rk === rk)) return;
  queued.push({ id, L, tx, ty, quality, rk });
}

// ------------------------------------------------------------- images/layout
const imgById = new Map();
let nextId = 1;

// level so a tile texel maps to <= 1 physical pixel once settled
function levelForImage(im) {
  const s = view.scale; // scene px -> css px (image drawn at fitFactor*scale)
  const eff = s * im.fitFactor; // source px -> css px
  if (interacting) return clamp(Math.round(-Math.log2(eff)), 0, im.maxLevel);
  return clamp(Math.floor(-Math.log2(eff * dpr)), 0, im.maxLevel);
}

function parseName(fname) {
  const base = fname.replace(/\/+$/, "");
  const noext = base.replace(/\.[^.]+$/, "");
  const m = NAME_RE.exec(noext);
  if (!m) return null;
  return { group: parseInt(m[1], 10), order: parseInt(m[2], 10), name: m[3] || noext };
}

// Build the layout: groups stacked top->bottom, each a square grid of square cells.
function buildLayout(list) {
  // list: [{href, meta:{group,order,name}}]
  const groups = new Map();
  for (const it of list) {
    if (!groups.has(it.meta.group)) groups.set(it.meta.group, []);
    groups.get(it.meta.group).push(it);
  }
  const gkeys = [...groups.keys()].sort((a, b) => a - b);
  let y = 0;
  let maxRight = 0;
  images = [];
  imgById.clear();
  for (const gk of gkeys) {
    const items = groups.get(gk).sort((a, b) => a.meta.order - b.meta.order);
    const cols = Math.max(1, Math.ceil(Math.sqrt(items.length)));
    const rows = Math.ceil(items.length / cols);
    for (let i = 0; i < items.length; i++) {
      const col = i % cols, row = (i / cols) | 0;
      const ox = col * (CELL + CELL_GAP);
      const oy = y + row * (CELL + LABEL_H + CELL_GAP);
      const im = {
        id: nextId++,
        href: items[i].href,
        // Resolve to an absolute URL up front so Safari doesn't re-encode the
        // already-percent-encoded href (which turned %20 into %2520 -> bad req).
        url: new URL(items[i].href, location.href).href,
        name: items[i].meta.name,
        group: gk, order: items[i].meta.order,
        extra: !!items[i].meta.extra,
        cellX: ox, cellY: oy + LABEL_H, cell: CELL, labelY: oy,
        iw: 0, ih: 0, maxLevel: 0, fitFactor: 1,
        drawX: ox, drawY: oy + LABEL_H, drawW: CELL, drawH: CELL,
        bitmap: null, status: "pending", progress: 0,
      };
      images.push(im);
      imgById.set(im.id, im);
      maxRight = Math.max(maxRight, ox + CELL);
    }
    y += rows * (CELL + LABEL_H + CELL_GAP) + GROUP_GAP;
  }
  scene.w = maxRight;
  scene.h = Math.max(0, y - GROUP_GAP);
}

// Fit a decoded image inside its square cell, preserving aspect.
function fitImage(im) {
  const s = Math.min(im.cell / im.iw, im.cell / im.ih);
  im.fitFactor = s;
  im.drawW = im.iw * s;
  im.drawH = im.ih * s;
  im.drawX = im.cellX + (im.cell - im.drawW) / 2;
  im.drawY = im.cellY + (im.cell - im.drawH) / 2;
  im.maxLevel = Math.max(0, Math.ceil(Math.log2(Math.max(im.iw, im.ih) / TILE)));
}

// Update the running estimate of a full-res source's size (for window sizing).
function trackSourceSize(im) {
  const bytes = im.iw * im.ih * 4;
  avgSourceBytes = avgSourceBytes ? avgSourceBytes * 0.8 + bytes * 0.2 : bytes;
}

// ------------------------------------------------------------- view helpers
function fitView() {
  const vpw = cv.clientWidth || els.left.clientWidth;
  const vph = cv.clientHeight || els.left.clientHeight;
  if (!scene.w || !scene.h) { view.scale = 1; view.vx = 0; view.vy = 0; return; }
  view.fitScale = Math.min(vpw / scene.w, vph / scene.h) * 0.96;
  view.scale = view.fitScale;
  view.vx = (vpw - scene.w * view.scale) / 2;
  view.vy = (vph - scene.h * view.scale) / 2;
}

// ------------------------------------------------------------- directory load
async function loadDirectory() {
  status("Listing folder…");
  loadGeneration++;
  images = [];
  cache.clear();
  cacheBytes = 0;
  inflight.clear();
  queued.length = 0;
  readySources.clear();
  sourceLoading.clear();
  redecoding.clear();
  sourceFailedAt.clear();
  sourceLoadCount = 0;
  if (tileWorker) tileWorker.postMessage({ type: "clear" });
  let data;
  try {
    const res = await cpFetch("./?ls", { headers: { "Accept": "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  } catch (e) {
    status("Could not list folder: " + e.message);
    return;
  }
  const files = (data.files || []);
  const matched = [];
  const extra = [];
  for (const f of files) {
    const href = f.href;
    if (!href || !IMG_EXT.test(href)) continue;
    const dec = decodeURIComponent(href);
    const meta = parseName(dec);
    if (meta) matched.push({ href, meta });
    else extra.push({ href, name: dec.replace(/\/+$/, "").replace(/\.[^.]+$/, "") });
  }
  if (!matched.length && !extra.length) {
    status("No images found in this folder.");
    stateHasImages = false;
    buildLayout([]);
    requestRender();
    return;
  }
  // matched: group asc, order asc
  matched.sort((a, b) => a.meta.group - b.meta.group || a.meta.order - b.meta.order);
  // non-matching images go into an extra group placed below all numbered groups
  const list = matched.slice();
  if (extra.length) {
    let maxGroup = matched.length ? matched[matched.length - 1].meta.group : 0;
    const extraGroup = maxGroup + 1;
    extra.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    extra.forEach((it, i) => {
      list.push({ href: it.href, meta: { group: extraGroup, order: i + 1, name: it.name, extra: true } });
    });
  }
  buildLayout(list);
  stateHasImages = images.length > 0;
  fitView();
  requestRender();
  status(`Found ${images.length} image(s) in ${new Set(images.map(i=>i.group)).size} group(s). Loading…`);
  loadSequential(0);
}

async function loadSequential(idx) {
  if (idx >= images.length) { status(`Loaded ${images.length} image(s).`); return; }
  const im = images[idx];
  im.status = "downloading";
  im.progress = 0;
  requestRender();
  try {
    const tLoad = profStart("load.image");
    const blob = await getImageBlob(im);
    im.status = "decoding";
    requestRender();
    const tDecode = profStart("load.decode");
    const bitmap = await createImageBitmap(blob);
    profEnd(tDecode);
    im.bitmap = bitmap;
    im.iw = bitmap.width;
    im.ih = bitmap.height;
    fitImage(im);
    im.status = "loaded";
    trackSourceSize(im);
    addSource(im);
    requestRender();
    profEnd(tLoad);
  } catch (e) {
    im.status = "error";
    im.error = e.message;
    requestRender();
  }
  // strictly sequential: next only after this finishes, with a small pause to
  // let the (slow) server catch up before the next request
  setTimeout(() => loadSequential(idx + 1), DOWNLOAD_GAP_MS);
}

// Get the image blob: blob cache first, else download (with progress) and store.
async function getImageBlob(im) {
  const cached = await blobCacheGet(im.url);
  if (cached) {
    cacheLog(`hit  ${im.url} (${(cached.size / 1048576).toFixed(1)}MB)`);
    im.progress = 1;
    return cached;
  }
  cacheLog(`miss ${im.url}`);
  const blob = await downloadWithProgress(im);
  blobCachePut(im.url, blob);
  return blob;
}

async function downloadWithProgress(im) {
  const res = await cpFetch(im.url, {});
  if (!res.ok) throw new Error("HTTP " + res.status);
  const total = parseInt(res.headers.get("content-length") || "0", 10);
  if (!res.body || !total) {
    // no streaming/length: indeterminate
    im.progress = -1;
    requestRender();
    return await res.blob();
  }
  const reader = res.body.getReader();
  const chunks = [];
  let received = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    im.progress = received / total;
    requestRender();
  }
  return new Blob(chunks);
}

// ------------------------------------------------------------- scheduler
// Event-driven tile scheduler. Recomputes the desired tile set for the current
// view, keeps a budget-sized window of sources resident in the worker, and
// enqueues tiles image-by-image in priority order. It runs only in response to
// real changes (view move/settle, source ready/evicted, tile skipped) — never
// from inside the draw pass — so the app is fully idle when nothing changes.

// Number of images allowed to hold a resident source concurrently, derived from
// the source memory budget. Scales from 1 (phones) up to MAX_ACTIVE (desktops).
function activeWindowSize() {
  if (avgSourceBytes <= 0) return 1;
  const budget = sourceBudgetMB * 1024 * 1024;
  return clamp(Math.floor(budget / avgSourceBytes), 1, MAX_ACTIVE);
}

// Visible, loaded images ordered nearest-first from the cursor (or centre).
function visibleImages() {
  const vpw = cv.clientWidth, vph = cv.clientHeight;
  const sc = view.scale;
  const sx0 = (0 - view.vx) / sc, sy0 = (0 - view.vy) / sc;
  const sx1 = (vpw - view.vx) / sc, sy1 = (vph - view.vy) / sc;
  const ox = cursorX >= 0 ? cursorX : vpw / 2;
  const oy = cursorY >= 0 ? cursorY : vph / 2;
  const out = [];
  for (const im of images) {
    if (im.status !== "loaded") continue;
    const cx0 = im.cellX, cy0 = im.labelY, cx1 = im.cellX + im.cell, cy1 = im.cellY + im.cell;
    if (cx1 < sx0 || cx0 > sx1 || cy1 < sy0 || cy0 > sy1) continue;
    const [cx, cy] = sceneToDev(im.cellX + im.cell / 2, im.labelY + im.cell / 2);
    const d2 = (cx - ox) * (cx - ox) + (cy - oy) * (cy - oy);
    out.push({ im, d2 });
  }
  out.sort((a, b) => a.d2 - b.d2);
  return out.map((o) => o.im);
}

// Does this image still have missing high tiles at its current target level?
function imageNeedsHighTiles(im) {
  if (im.status !== "loaded") return false;
  const sc = view.scale;
  const [dx, dy] = sceneToDev(im.drawX, im.drawY);
  const dw = im.drawW * sc, dh = im.drawH * sc;
  const L = levelForImage(im);
  const r = tileRange(im, L, sc, dx, dy, dw, dh);
  for (let ty = r.ty0; ty <= r.ty1; ty++)
    for (let tx = r.tx0; tx <= r.tx1; tx++)
      if (!cacheHasHigh(tileKey(im.id, L, tx, ty))) return true;
  return false;
}

// Enqueue this image's outstanding high tiles, nearest-first from the cursor.
function enqueueImageTiles(im) {
  if (!readySources.has(im.id)) return;
  const sc = view.scale;
  const [dx, dy] = sceneToDev(im.drawX, im.drawY);
  const dw = im.drawW * sc, dh = im.drawH * sc;
  const L = levelForImage(im);
  const r = tileRange(im, L, sc, dx, dy, dw, dh);
  const vpw = cv.clientWidth, vph = cv.clientHeight;
  const ox = cursorX >= 0 ? cursorX : vpw / 2;
  const oy = cursorY >= 0 ? cursorY : vph / 2;
  const twsc = TILE * Math.pow(2, L) * im.fitFactor * sc;
  const pend = [];
  for (let ty = r.ty0; ty <= r.ty1; ty++)
    for (let tx = r.tx0; tx <= r.tx1; tx++) {
      if (cacheHasHigh(tileKey(im.id, L, tx, ty))) continue;
      const cx = dx + (tx + 0.5) * twsc;
      const cy = dy + (ty + 0.5) * twsc;
      const d2 = (cx - ox) * (cx - ox) + (cy - oy) * (cy - oy);
      pend.push({ tx, ty, d2 });
    }
  pend.sort((a, b) => a.d2 - b.d2);
  for (const t of pend) requestTile(im.id, L, t.tx, t.ty, "high");
}

// Ensure the pinned whole-image base tile (low, then high) exists for the image
// so every visible image always has a low-quality background underlay.
function requestBaseTiles(im) {
  const k = tileKey(im.id, im.maxLevel, 0, 0);
  const e = cache.get(k);
  if (!e) requestTile(im.id, im.maxLevel, 0, 0, "low");
  else if (e.quality !== "high") requestTile(im.id, im.maxLevel, 0, 0, "high");
}

// Start decoding an image's source (from the cached blob) if it is missing and
// a decode slot is free. The window ordering guarantees this never evicts a
// higher-priority resident source.
function requestSourceLoad(im) {
  if (readySources.has(im.id) || sourceLoading.has(im.id) || redecoding.has(im.id)) return;
  if (sourceLoadCount >= MAX_SRC_LOADS) return;
  const failed = sourceFailedAt.get(im.id);
  if (failed && performance.now() - failed < 2000) return; // backoff after a miss
  sourceLoadCount++;
  sourceLoading.add(im.id);
  const gen = loadGeneration;
  ensureSource(im).then((ok) => {
    if (gen !== loadGeneration) return; // stale after a reload
    if (!ok) { sourceFailedAt.set(im.id, performance.now()); sourceLoading.delete(im.id); }
    sourceLoadCount--;
    reconcile();
  });
}

// Rebuild the pending queue from the current desired set. Drops stale (now
// off-screen) requests and only tiles images inside the active window.
function reconcile() {
  if (!workerSupported || !workerReady || !stateHasImages) return;
  queued.length = 0;

  // Every visible image gets its base tile; while interacting we stop here so
  // pan/zoom shows a low-quality background instead of chasing moving tiles.
  const order = visibleImages();
  for (const im of order) requestBaseTiles(im);
  if (interacting) { pumpQueue(); return; }

  const win = activeWindowSize();
  let activated = 0;
  for (const im of order) {
    if (!imageNeedsHighTiles(im)) continue;
    if (activated >= win) break;
    activated++;
    if (!readySources.has(im.id)) { requestSourceLoad(im); continue; }
    enqueueImageTiles(im);
  }
  pumpQueue();
}

// ------------------------------------------------------------- render
function render() {
  needRender = false;
  const tFrame = profStart("frame.total");
  const tView = profStart("view.collect");
  const vpw = cv.clientWidth, vph = cv.clientHeight;
  if (!vpw || !vph) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#808080";
  ctx.fillRect(0, 0, vpw, vph);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  const sc = view.scale;
  // viewport in scene coords
  const sx0 = (0 - view.vx) / sc, sy0 = (0 - view.vy) / sc;
  const sx1 = (vpw - view.vx) / sc, sy1 = (vph - view.vy) / sc;

  // collect visible images
  const visible = [];
  for (const im of images) {
    const cx0 = im.cellX, cy0 = im.labelY, cx1 = im.cellX + im.cell, cy1 = im.cellY + im.cell;
    if (cx1 < sx0 || cx0 > sx1 || cy1 < sy0 || cy0 > sy1) continue;
    visible.push(im);
  }
  profEnd(tView);

  // Pure cache read: base underlay + any generated tiles. Drawing never
  // enqueues requests — the event-driven scheduler handles all of that.
  const tDraw = profStart("draw.images");
  for (const im of visible) {
    drawImageEntry(im, sc);
  }
  profEnd(tDraw);

  els.zoom.textContent = (view.scale * 100).toFixed(0) + "%";
  if (tileDebug) updateStats();
  profEnd(tFrame);
  profFrame();
}

function sceneToDev(x, y) { return [view.vx + x * view.scale, view.vy + y * view.scale]; }

function drawLabel(im) {
  const [lx, ly] = sceneToDev(im.cellX, im.labelY + LABEL_H);
  const fs = Math.max(10, Math.min(28, LABEL_FONT * view.scale));
  ctx.font = "600 " + fs + "px system-ui, sans-serif";
  ctx.fillStyle = getCss("--text");
  ctx.textBaseline = "bottom";
  const label = im.extra ? im.name : (im.group + "." + im.order + "  " + im.name);
  ctx.fillText(label, lx, ly - 6 * view.scale);
}

function getCss(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#000"; }

function drawImageEntry(im, sc) {
  drawLabel(im);

  if (im.status !== "loaded") {
    drawPlaceholder(im, sc);
    return;
  }

  // draw the image via per-image tile composite, clipped to its draw rect
  const [dx, dy] = sceneToDev(im.drawX, im.drawY);
  const dw = im.drawW * sc, dh = im.drawH * sc;
  ctx.save();
  ctx.beginPath();
  ctx.rect(dx, dy, dw, dh);
  ctx.clip();

  // Stateless composite: draw every cached tile from the coarsest whole-image
  // base (the low-quality underlay) down to the current target level. Absent
  // tiles fall through to whatever is beneath, so cache misses show the base
  // instead of grey, and zoom-in progressively sharpens as finer tiles arrive.
  const L = levelForImage(im);
  for (let lv = im.maxLevel; lv >= L; lv--) {
    const r = tileRange(im, lv, sc, dx, dy, dw, dh);
    const twsc = TILE * Math.pow(2, lv) * im.fitFactor * sc;
    for (let ty = r.ty0; ty <= r.ty1; ty++)
      for (let tx = r.tx0; tx <= r.tx1; tx++) {
        const entry = cacheGet(tileKey(im.id, lv, tx, ty));
        if (!entry) continue;
        ctx.drawImage(entry.img, dx + tx * twsc, dy + ty * twsc, twsc, twsc);
      }
  }

  if (tileDebug) {
    // blue border around loaded images
    if (im.status === "loaded") {
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#1ca7e8";
      ctx.strokeRect(dx + 0.5, dy + 0.5, dw - 1, dh - 1);
      ctx.lineWidth = 1;
    }
    const rr = tileRange(im, L, sc, dx, dy, dw, dh);
    const twsc = TILE * Math.pow(2, L) * im.fitFactor * sc;
    ctx.lineWidth = 1;
    ctx.font = "600 11px system-ui, sans-serif";
    ctx.textBaseline = "top";
    for (let ty = rr.ty0; ty <= rr.ty1; ty++)
      for (let tx = rr.tx0; tx <= rr.tx1; tx++) {
        const e = cache.get(tileKey(im.id, L, tx, ty));
        const col = e ? (e.quality === "high" ? "#00e000" : "#e0c000") : "#ff2020";
        const tdx = dx + tx * twsc, tdy = dy + ty * twsc;
        ctx.strokeStyle = col;
        ctx.strokeRect(tdx + 0.5, tdy + 0.5, twsc - 1, twsc - 1);
        ctx.fillStyle = col;
        ctx.fillText("L" + L + " " + tx + "," + ty, tdx + 3, tdy + 3);
      }
  }

  ctx.restore();

  // frame
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1;
  ctx.strokeRect(dx + 0.5, dy + 0.5, dw - 1, dh - 1);
}

// visible tile range for an image level, clamped to image extent and viewport rect
function tileRange(im, lv, sc, dx, dy, dw, dh) {
  const tileWpx = TILE * Math.pow(2, lv) * im.fitFactor * sc; // one tile's device px
  const vpw = cv.clientWidth, vph = cv.clientHeight;
  // intersect image draw-rect with viewport in device space
  const ix0 = Math.max(0, dx), iy0 = Math.max(0, dy);
  const ix1 = Math.min(vpw, dx + dw), iy1 = Math.min(vph, dy + dh);
  const nx = Math.ceil(im.iw / (TILE * Math.pow(2, lv))) - 1;
  const ny = Math.ceil(im.ih / (TILE * Math.pow(2, lv))) - 1;
  return {
    tx0: Math.max(0, Math.floor((ix0 - dx) / tileWpx)),
    ty0: Math.max(0, Math.floor((iy0 - dy) / tileWpx)),
    tx1: Math.min(nx, Math.floor((ix1 - dx) / tileWpx)),
    ty1: Math.min(ny, Math.floor((iy1 - dy) / tileWpx)),
  };
}

function drawPlaceholder(im, sc) {
  const [dx, dy] = sceneToDev(im.cellX, im.cellY);
  const dw = im.cell * sc, dh = im.cell * sc;
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  ctx.fillRect(dx, dy, dw, dh);
  ctx.strokeStyle = im.status === "error" ? "#e05555" : "rgba(255,255,255,0.35)";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([8, 8]);
  ctx.strokeRect(dx + 1, dy + 1, dw - 2, dh - 2);
  ctx.setLineDash([]);

  // loading bar (downloading / decoding)
  const barW = Math.min(dw * 0.7, 480);
  const barH = Math.max(6, Math.min(22, dh * 0.03));
  const bx = dx + (dw - barW) / 2, by = dy + (dh - barH) / 2;
  const label =
    im.status === "downloading" ? (im.progress >= 0 ? Math.round(im.progress * 100) + "%" : "downloading…") :
    im.status === "decoding" ? "decoding…" :
    im.status === "error" ? ("error: " + (im.error || "")) : "";

  if (im.status === "downloading" || im.status === "decoding") {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(bx, by, barW, barH);
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, barW - 1, barH - 1);
    let frac = 0;
    if (im.status === "downloading") frac = im.progress >= 0 ? im.progress : 0.15;
    else frac = 1;
    ctx.fillStyle = getCss("--accent");
    ctx.fillRect(bx + 1, by + 1, Math.max(0, (barW - 2) * frac), barH - 2);
  }
  if (label) {
    const fs = Math.max(11, Math.min(30, barH + 6));
    ctx.font = "600 " + fs + "px system-ui, sans-serif";
    ctx.fillStyle = im.status === "error" ? "#ff8888" : getCss("--text");
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(label, dx + dw / 2, by + barH + 8);
    ctx.textAlign = "left";
  }
}

// ------------------------------------------------------------- interaction
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const f = Math.exp(-e.deltaY * 0.0012);
  const ns = clamp(view.scale * f, 0.00005, 64);
  const wx = (mx - view.vx) / view.scale;
  const wy = (my - view.vy) / view.scale;
  view.vx = mx - wx * ns;
  view.vy = my - wy * ns;
  view.scale = ns;
  markInteracting();
  requestRender();
}, { passive: false });

let panning = null;
const activePointers = new Map();
let pinch = null;

cv.addEventListener("pointerdown", (e) => {
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (e.pointerType === "touch") {
    activePointers.set(e.pointerId, { x: mx, y: my });
    if (activePointers.size === 2) { beginPinch(); panning = null; return; }
    if (activePointers.size > 2) return;
  }
  panning = { x: e.clientX, y: e.clientY, vx: view.vx, vy: view.vy };
});
cv.addEventListener("pointermove", (e) => {
  const rect = cv.getBoundingClientRect();
  cursorX = e.clientX - rect.left;
  cursorY = e.clientY - rect.top;
  if (e.pointerType === "touch" && activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX - rect.left, y: e.clientY - rect.top });
    if (pinch && activePointers.size >= 2) { updatePinch(); return; }
  }
  if (!panning) return;
  view.vx = panning.vx + (e.clientX - panning.x);
  view.vy = panning.vy + (e.clientY - panning.y);
  markInteracting();
  requestRender();
});
function endPointer(e) {
  if (e.pointerType === "touch" && activePointers.has(e.pointerId)) {
    if (pinch) { activePointers.delete(e.pointerId); pinch = null;
      if (activePointers.size === 1) {
        const only = activePointers.values().next().value;
        const rect = cv.getBoundingClientRect();
        panning = { x: only.x + rect.left, y: only.y + rect.top, vx: view.vx, vy: view.vy };
      }
      return;
    }
    activePointers.delete(e.pointerId);
  }
  panning = null;
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerleave", () => { cursorX = -1; cursorY = -1; });
function beginPinch() {
  const [a, b] = [...activePointers.values()];
  const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  pinch = { startDist: dist, startScale: view.scale, startVx: view.vx, startVy: view.vy,
            midX: (a.x + b.x) / 2, midY: (a.y + b.y) / 2 };
}
function updatePinch() {
  const [a, b] = [...activePointers.values()];
  if (!a || !b) return;
  const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  const midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
  const ns = clamp(pinch.startScale * (dist / pinch.startDist), 0.00005, 64);
  const wx = (pinch.midX - pinch.startVx) / pinch.startScale;
  const wy = (pinch.midY - pinch.startVy) / pinch.startScale;
  view.scale = ns;
  view.vx = midX - wx * ns;
  view.vy = midY - wy * ns;
  markInteracting();
  requestRender();
}

// ------------------------------------------------------------- toolbar
els.fit.addEventListener("click", () => { fitView(); reconcile(); requestRender(); });
els.reload.addEventListener("click", () => { loadDirectory(); });
els.tiledbg.addEventListener("click", () => {
  tileDebug = !tileDebug;
  els.tiledbg.textContent = "Tile debug: " + (tileDebug ? "on" : "off");
  els.stats.hidden = !tileDebug;
  requestRender();
});
window.addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") { fitView(); reconcile(); requestRender(); }
});

// ------------------------------------------------------------- stats bar
// Recompute tile statistics each frame and render them into the debug bottom bar.
function updateStats() {
  const sc = view.scale;
  const vpw = cv.clientWidth, vph = cv.clientHeight;
  const sx0 = (0 - view.vx) / sc, sy0 = (0 - view.vy) / sc;
  const sx1 = (vpw - view.vx) / sc, sy1 = (vph - view.vy) / sc;

  let onScreen = 0;      // target-level tiles intersecting the viewport (all images)
  let toProcess = 0;     // target-level tiles present on screen but not yet high
  let loadedImages = 0, totalImages = images.length;
  let cached = cache.size;
  let inFlight = inflight.size, queuedN = queued.length;
  let outstand = 0;      // images still needing high tiles
  for (const im of images) {
    if (im.status === "loaded") loadedImages++;
    if (im.status === "loaded" && imageNeedsHighTiles(im)) outstand++;
    if (im.status !== "loaded") continue;
    const cx0 = im.cellX, cy0 = im.labelY, cx1 = im.cellX + im.cell, cy1 = im.cellY + im.cell;
    if (cx1 < sx0 || cx0 > sx1 || cy1 < sy0 || cy0 > sy1) continue;
    const [dx, dy] = sceneToDev(im.drawX, im.drawY);
    const dw = im.drawW * sc, dh = im.drawH * sc;
    const L = levelForImage(im);
    const r = tileRange(im, L, sc, dx, dy, dw, dh);
    const n = Math.max(0, r.tx1 - r.tx0 + 1) * Math.max(0, r.ty1 - r.ty0 + 1);
    onScreen += n;
    for (let ty = r.ty0; ty <= r.ty1; ty++)
      for (let tx = r.tx0; tx <= r.tx1; tx++)
        if (!cacheHasHigh(tileKey(im.id, L, tx, ty))) toProcess++;
  }
  els.stats.textContent =
    `img ${loadedImages}/${totalImages} (needTiles ${outstand})  ` +
    `tiles onScreen ${onScreen}  toProcess ${toProcess}  cached ${cached}  ` +
    `inflight ${inFlight}/${MAX_INFLIGHT}  queued ${queuedN}  ` +
    `srcBudget ${sourceBudgetMB}MB  window ${activeWindowSize()}  resident ${readySources.size}`;
}

// ------------------------------------------------------------- go
loadDirectory();

})();
</script>
